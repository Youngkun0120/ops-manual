<meta charset="utf-8">
<title>서비스 운영팀 업무 매뉴얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --surface-2:#eef1f4;
  --ink:#1a2230;
  --ink-muted:#5c6675;
  --ink-faint:#8a93a1;
  --border:#e1e5ea;
  --border-strong:#c7ced7;
  --accent:#0f5c56;
  --accent-ink:#0a3f3b;
  --accent-soft:#e3f1ee;
  --accent-soft-border:#bcdcd5;
  --warn:#a5540d;
  --warn-soft:#fbf1e4;
  --warn-soft-border:#eccb9a;
  --danger:#a3311f;
  --danger-soft:#fbeeec;
  --danger-soft-border:#eeb9ad;
  --code-bg:#eef1f4;
  --shadow: 0 1px 2px rgba(20,30,40,.04), 0 8px 24px -12px rgba(20,30,40,.12);
  --focus: #0f5c56;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;
    --surface:#181d25;
    --surface-2:#1f2530;
    --ink:#e7ebf0;
    --ink-muted:#a3adba;
    --ink-faint:#717c8a;
    --border:#2a313c;
    --border-strong:#3a4350;
    --accent:#4fc9bc;
    --accent-ink:#bdf0e7;
    --accent-soft:#173330;
    --accent-soft-border:#255049;
    --warn:#e3a765;
    --warn-soft:#2e2415;
    --warn-soft-border:#5a4526;
    --danger:#e08674;
    --danger-soft:#2c1a17;
    --danger-soft-border:#5c332b;
    --code-bg:#1f2530;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;
  --surface:#181d25;
  --surface-2:#1f2530;
  --ink:#e7ebf0;
  --ink-muted:#a3adba;
  --ink-faint:#717c8a;
  --border:#2a313c;
  --border-strong:#3a4350;
  --accent:#4fc9bc;
  --accent-ink:#bdf0e7;
  --accent-soft:#173330;
  --accent-soft-border:#255049;
  --warn:#e3a765;
  --warn-soft:#2e2415;
  --warn-soft-border:#5a4526;
  --danger:#e08674;
  --danger-soft:#2c1a17;
  --danger-soft-border:#5c332b;
  --code-bg:#1f2530;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR','IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14.5px;
  line-height:1.65;
}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;text-wrap:balance;color:var(--ink);margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:272px;flex:0 0 272px;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:20px 16px 32px;
}
.brand{padding:4px 8px 16px}
.brand .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-weight:600}
.brand h1{font-size:17px;font-weight:700;margin-top:4px;line-height:1.35}
.brand .sub{font-size:12px;color:var(--ink-muted);margin-top:6px}

.searchbox{position:relative;margin:0 4px 18px}
.searchbox input{
  width:100%;padding:9px 12px 9px 32px;border-radius:8px;
  border:1px solid var(--border-strong);background:var(--surface-2);
  color:var(--ink);font-size:13px;
}
.searchbox input:focus{background:var(--surface);border-color:var(--accent)}
.searchbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint)}
.search-results{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;padding:6px;
}
.search-results.open{display:block}
.search-results .sr-count{font-size:11px;color:var(--ink-faint);padding:6px 8px 4px}
.search-results .sr-empty{font-size:12.5px;color:var(--ink-faint);padding:14px 8px;text-align:center}
.sr-item{display:block;padding:8px 9px;border-radius:7px;text-decoration:none;cursor:pointer}
.sr-item:hover{background:var(--surface-2)}
.sr-item .sr-group{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.sr-item .sr-label{font-size:13px;color:var(--ink);font-weight:600;margin-top:1px}

.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.navlist a{
  display:flex;gap:9px;align-items:baseline;padding:7px 8px;border-radius:7px;
  text-decoration:none;color:var(--ink-muted);font-size:13px;font-weight:500;
}
.navlist a:hover{background:var(--surface-2);color:var(--ink)}
.navlist a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.navlist .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);flex:0 0 20px}
.navlist a.active .num{color:var(--accent)}
.navlist a.home-link{font-size:14px;font-weight:700;color:var(--ink);padding:9px 8px;margin-bottom:6px}
.navlist a.home-link .icon{flex:0 0 auto}
.navlist a.home-link.active{background:var(--accent-soft);color:var(--accent-ink)}
.navdivider{height:1px;background:var(--border);margin:14px 6px}
.navgroup-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding:0 8px;margin:2px 0 4px;font-weight:600}

/* ---------- Breadcrumb / page meta ---------- */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-faint);margin-bottom:14px}
.crumb a{color:var(--ink-faint);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--accent);text-decoration:underline}
.crumb .sep{color:var(--border-strong)}
.crumb .cur{color:var(--ink-muted)}
.kv-pill{
  display:inline-flex;gap:5px;align-items:center;padding:5px 11px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;
}
.kv-pill .k{color:var(--ink-faint);font-weight:600}
.kv-pill .v{color:var(--ink)}
.page-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-muted);
  font-size:12.5px;font-weight:600;cursor:not-allowed;opacity:.75;
}
.link-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  border:1px solid var(--accent-soft-border);background:var(--accent-soft);color:var(--accent-ink);
  font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;
}
.link-btn:hover{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.inline-link{
  display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:1px 7px 1px 6px;border-radius:999px;
  background:var(--accent-soft);border:1px solid var(--accent-soft-border);color:var(--accent-ink);
  font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;vertical-align:1px;
}
.inline-link:hover{background:var(--accent);color:var(--surface)}
.inline-link svg{width:9px;height:9px;flex:0 0 auto}
.ref-shot{
  margin:18px 0;padding:22px;border:1.5px dashed var(--border-strong);border-radius:12px;
  text-align:center;color:var(--ink-faint);font-size:12.5px;background:var(--surface-2);
}
.ref-shot .big{font-size:20px;display:block;margin-bottom:4px}

.main{flex:1;min-width:0}
.topbar{
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:10px 32px;display:none;
  align-items:center;gap:10px;
}
.content{max-width:900px;margin:0 auto;padding:40px 32px 120px}

/* ---------- Header block ---------- */
.doc-header{margin-bottom:8px}
.doc-header .kicker{font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;font-weight:700}
.doc-header h1{font-size:30px;margin-top:8px;font-weight:700}
.doc-header p.lede{color:var(--ink-muted);font-size:15px;margin-top:10px;max-width:62ch}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.meta-pill{
  display:flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--ink-muted);
}
.meta-pill b{color:var(--ink);font-weight:600}

.provenance{
  margin-top:22px;padding:16px 18px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  font-size:13px;color:var(--ink-muted);
}
.provenance b{color:var(--ink)}
.provenance ul{margin:8px 0 0;padding-left:18px}
.provenance li{margin:3px 0}

/* ---------- Module sections ---------- */
.module{scroll-margin-top:24px;padding-top:56px;margin-top:-56px}
.module-head{display:flex;align-items:baseline;gap:12px;margin:64px 0 6px}
.module-head .modnum{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:14px;font-weight:600}
.module-head h2{font-size:22px;font-weight:700}
.module-desc{color:var(--ink-muted);font-size:13.5px;margin:2px 0 24px;max-width:64ch}
.module:first-of-type .module-head{margin-top:36px}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
}
.card-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:16px 20px;cursor:pointer;
}
.card-head:hover{background:var(--surface-2)}
.card.static .card-head{cursor:default}
.card.static .card-head:hover{background:var(--surface)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
.card-title{font-size:15.5px;font-weight:700;color:var(--ink)}
.card-sub{font-size:12.5px;color:var(--ink-muted);margin-top:3px}
.card-chevron{flex:0 0 auto;color:var(--ink-faint);transition:transform .15s ease;margin-top:3px}
.card.open .card-chevron{transform:rotate(90deg)}
.card-body{padding:0 20px 20px;display:none}
.card.open .card-body{display:block}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin-bottom:16px;padding-top:2px}
.field{border-top:1px solid var(--border);padding-top:8px}
.field .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.field .v{font-size:13px;color:var(--ink);margin-top:3px;line-height:1.5}

.subhead{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 8px}
.subhead:first-child{margin-top:0}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:step}
ol.steps li{
  counter-increment:step;position:relative;padding:2px 0 10px 30px;font-size:13.5px;line-height:1.6;
}
ol.steps li::before{
  content:counter(step);position:absolute;left:0;top:2px;
  width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
ol.steps li .sub{color:var(--ink-muted);font-size:12.5px;margin-top:3px}
ol.steps li .sub ul{margin:4px 0 0;padding-left:16px}
ol.steps li .sub li{padding:1px 0}

ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{position:relative;padding:2px 0 6px 14px;font-size:13.5px}
ul.plain li::before{content:"–";position:absolute;left:0;color:var(--ink-faint)}

.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12px;padding:4px 9px;border-radius:7px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--ink-muted);
}

.callout{border-radius:9px;padding:11px 14px;font-size:13px;margin:10px 0;display:flex;gap:9px}
.callout .icon{flex:0 0 auto;margin-top:1px}
.callout.warn{background:var(--warn-soft);border:1px solid var(--warn-soft-border);color:var(--warn)}
.callout.warn b{color:var(--warn)}
.callout.danger{background:var(--danger-soft);border:1px solid var(--danger-soft-border);color:var(--danger)}
.callout.tip{background:var(--accent-soft);border:1px solid var(--accent-soft-border);color:var(--accent-ink)}

.contact-block{display:flex;flex-direction:column;gap:4px}
.contact-line{font-size:12.5px;color:var(--ink-muted)}
.contact-line b{color:var(--ink);font-weight:600;margin-right:4px}
.contact-line .addr{font-family:'IBM Plex Mono',monospace;font-size:12px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:auto}
td, th{white-space:nowrap;max-width:none}
td.wrap{white-space:normal;min-width:220px}
table caption{text-align:left;font-weight:700;font-size:14.5px;padding:14px 16px 4px;color:var(--ink)}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;
  padding:9px 14px;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.dim{color:var(--ink-muted)}
table.tight td, table.tight th{padding:7px 12px}
.cal-link{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;margin:0 4px 4px 0;border-radius:999px;
  background:var(--accent-soft);border:1px solid var(--accent-soft-border);color:var(--accent-ink);
  font-size:11.5px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;
}
.cal-link:hover{background:var(--accent);color:var(--surface)}
.home-h2{font-size:15px;font-weight:700;color:var(--ink);margin:38px 0 4px}
.home-h2 .em{font-size:16px;margin-right:6px}
.home-h2-desc{color:var(--ink-muted);font-size:13px;margin:0 0 14px;max-width:64ch}

/* ---------- Checklist ---------- */
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist li{border-bottom:1px solid var(--border)}
.checklist li:last-child{border-bottom:none}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;cursor:pointer}
.check-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.check-row .txt{font-size:13.5px;flex:1}
.check-row .txt .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-muted);margin-right:7px;font-weight:600;vertical-align:1px}
.check-row.done .txt{color:var(--ink-faint);text-decoration:line-through}
.progress-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0 4px}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease}
.progress-label{font-size:12px;color:var(--ink-muted)}

/* ---------- Glossary ---------- */
.gloss-grid{display:grid;grid-template-columns:1fr;gap:0}
.gloss-item{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.gloss-item:last-child{border-bottom:none}
.gloss-term{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:3px 8px;align-self:start;text-align:center}
.gloss-def{font-size:13px;color:var(--ink-muted);line-height:1.55}

/* ---------- No-results / footer ---------- */
.no-results{display:none;text-align:center;padding:60px 20px;color:var(--ink-faint)}
mark{background:#ffe58a;color:#1a1a1a;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark, @media (prefers-color-scheme:dark){mark{background:#7a6420;color:#fff}}

.doc-footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--border);color:var(--ink-faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Mobile ---------- */
.menu-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--ink)}
@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow);width:82vw;max-width:300px}
  .sidebar.open{transform:translateX(0)}
  .topbar{display:flex}
  .content{padding:28px 18px 100px}
  .doc-header h1{font-size:24px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,14,20,.4);z-index:15}
  .scrim.open{display:block}
}
@media print{
  .sidebar,.topbar,.scrim{display:none!important}
  .card-body{display:block!important}
  .card{box-shadow:none;break-inside:avoid}
  body{font-size:11px}
}
/* 참고 화면 갤러리 (shots.js) */
.shots{margin:18px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shots.single{grid-template-columns:1fr}
.shot{margin:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);cursor:zoom-in}
.shot img{display:block;width:100%;height:160px;object-fit:cover;object-position:top left;background:var(--surface-2)}
.shots.single .shot img{height:auto;max-height:520px;object-fit:contain;object-position:top center}
.shot figcaption{padding:8px 10px;font-size:12px;color:var(--ink-muted);line-height:1.4;display:flex;gap:6px}
.shot figcaption .no{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);flex:0 0 auto}
.shots-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 -8px;font-size:12px;color:var(--ink-faint)}
.shots-head b{color:var(--ink-muted);font-weight:600}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,11,16,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:8px;background:#fff}
.lightbox .lb-cap{color:#e8ecf1;font-size:13px;margin-top:12px;text-align:center}
.lightbox button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
.lightbox .lb-close{top:16px;right:16px}
.lightbox .lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.lightbox .lb-next{right:16px;top:50%;transform:translateY(-50%)}
@media print{.shot img{height:auto;object-fit:contain}.lightbox{display:none!important}}
/* drive.js patch */
.drive-box{margin:16px 0 4px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.drive-box .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2,var(--bg))}
.drive-box .dh b{font-size:13px}
.drive-box .dh span{font-size:11.5px;color:var(--ink-faint)}
.drive-box ul{list-style:none;margin:0;padding:4px 0}
.drive-box li{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:baseline;padding:6px 14px}
.drive-box li+li{border-top:1px dashed var(--border)}
.drive-box .who{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;text-align:center;white-space:nowrap}

}
.ops-chip:hover{border-color:var(--accent)}

.ops-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px}

/* ========================================================================= renderers */
function esc(s){return s;}
function fieldGridHTML(fields){
  if(!fields || !fields.length) return '';
  return '<div class="field-grid">'+fields.map(f=>'<div class="field"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>').join('')+'</div>';
}
function stepsHTML(steps){ return '<ol class="steps">'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'; }
function plainListHTML(items){ return '<ul class="plain">'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; }
function sectionsHTML(sections){
  if(!sections) return '';
  return sections.map(sec=>{
    var inner = sec.steps ? stepsHTML(sec.steps) : (sec.list ? plainListHTML(sec.list) : '');
    return '<div class="subhead">'+sec.h+'</div>'+inner;
  }).join('');
}
function contactsHTML(contacts){
  if(!contacts || !contacts.length) return '';
  return '<div class="subhead">전달 · 수신처</div><div class="contact-block">'+
    contacts.map(c=>'<div class="contact-line"><b>'+c[0]+'</b>'+c[1]+'</div>').join('')+'</div>';
}
function calloutsHTML(list, cls, icon){
  if(!list || !list.length) return '';
  return list.map(t=>'<div class="callout '+cls+'"><span class="icon">'+ICONS[icon]+'</span><div>'+t+'</div></div>').join('');
}
function staticCardWrap(title, sub, inner){
  return '<div class="card open static">'+
    '<div class="card-head"><div><div class="card-title">'+title+'</div>'+(sub?'<div class="card-sub">'+sub+'</div>':'')+'</div></div>'+
    '<div class="card-body">'+inner+'</div></div>';
}
function renderCard(item){
  var fields = fieldGridHTML(item.fields);
  var sections = sectionsHTML(item.sections);
  var contacts = contactsHTML(item.contacts);
  var tips = calloutsHTML(item.tips,'tip','tip');
  var warns = calloutsHTML(item.warns,'warn','warn');
  return '<div class="card">'+
    '<div class="card-head" onclick="this.parentElement.classList.toggle(\'open\')">'+
      '<div><div class="card-title">'+item.title+'</div>'+(item.sub?'<div class="card-sub">'+item.sub+'</div>':'')+'</div>'+
      '<div class="card-chevron">'+ICONS.chevron+'</div>'+
    '</div>'+
    '<div class="card-body">'+fields+sections+contacts+tips+warns+'</div>'+
  '</div>';
}
function renderTable(item){
  var warn = item.warn ? '<div class="callout warn" style="margin:0 0 12px"><span class="icon">'+ICONS.warn+'</span><div>'+item.warn+'</div></div>' : '';
  var thead = '<tr>'+item.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr>';

function renderChecklist(item){

function renderItem(item){

function findPage(id){
  for(var g=0; g<NAV.length; g++){
    var entry = NAV[g];
    if(entry.home) continue;
    for(var i=0;i<entry.items.length;i++){
      if(entry.items[i].id===id){
        var p = entry.items[i];
        return {group:entry.group, id:p.id, label:p.label, refs:p.refs, lede:p.lede, url:p.url, urlLabel:p.urlLabel};
      }
    }
  }
  return null;
}

var LB = {page:null, i:0};
function openShot(pageId, i){ LB.page = pageId; LB.i = i; showShot(); document.getElementById('lightbox').classList.add('open'); }
function closeShot(){ document.getElementById('lightbox').classList.remove('open'); }
function stepShot(d){ var n = SHOTS[LB.page].length; LB.i = (LB.i + d + n) % n; showShot(); }
function showShot(){
  var list = SHOTS[LB.page], s = list[LB.i];
  document.getElementById('lbImg').src = s.src;
  document.getElementById('lbCap').textContent = (LB.i+1)+' / '+list.length+'  ·  '+s.cap;
  var multi = list.length > 1;
  document.querySelector('.lb-prev').style.display = multi ? '' : 'none';
  document.querySelector('.lb-next').style.display = multi ? '' : 'none';
}
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeShot();
  if(e.key==='ArrowLeft') stepShot(-1);
  if(e.key==='ArrowRight') stepShot(1);
});

    (lede?'<p style="color:var(--ink-muted);font-size:14.5px;max-width:64ch;margin:0">'+lede+'</p>':'')+
    metaPills(items)+
    (isRef?'':renderActions(entry))+

    TOOLBAR_HTML+
    (isRef?'':renderRefShot(pageId))+
    '<div style="margin-top:10px">'+linkDriveInline(renderPageBody(entry.refs))+'</div>';
}

/* ========================================================================= behavior */
function toggleCheck(el){
  var label = el.closest('.check-row');
  var key = label.getAttribute('data-key');
  try{ localStorage.setItem('manual_chk_'+key, el.checked?'1':'0'); }catch(e){}
  label.classList.toggle('done', el.checked);
  updateProgress(label.closest('ul.checklist'));
}
function updateProgress(ul){
  if(!ul) return;
  var id = ul.id.replace('list-','');
  var boxes = ul.querySelectorAll('input[type=checkbox]');
  var done = ul.querySelectorAll('input[type=checkbox]:checked').length;
  var pct = boxes.length ? Math.round(done/boxes.length*100) : 0;
  var fill = document.getElementById('progfill-'+id);
  var lbl = document.getElementById('prog-'+id);
  if(fill) fill.style.width = pct+'%';
  if(lbl) lbl.textContent = done+' / '+boxes.length+'건 확인 완료 ('+pct+'%)';
}
function initChecklists(){
  document.querySelectorAll('ul.checklist').forEach(function(ul){
    ul.querySelectorAll('label.check-row').forEach(function(label){
      var key = label.getAttribute('data-key');
      var val = '0';
      try{ val = localStorage.getItem('manual_chk_'+key) || '0'; }catch(e){}
      if(val==='1'){
        var cb = label.querySelector('input');
        cb.checked = true;
        label.classList.add('done');
      }
    });
    updateProgress(ul);
  });
}
function setupNav(){
  var nav = document.getElementById('navlist');
  var html = '<li><a class="home-link" data-id="home" onclick="navigate(\'home\')"><span class="icon">🏠</span>홈 · 전체 개요</a></li>';
  NAV.forEach(function(entry){
    if(entry.home) return;
    html += '<li class="navdivider"></li><li class="navgroup-label">'+entry.group+'</li>';
    entry.items.forEach(function(p){
      html += '<li><a data-id="'+p.id+'" onclick="navigate(\''+p.id+'\')">'+p.label+'</a></li>';
    });
  });
  nav.innerHTML = html;
}
function updateActiveNav(id){
  document.querySelectorAll('.navlist a').forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-id')===id); });
}
function textOf(item){
  var parts = [item.title||'', item.sub||''];
  if(item.type==='card'){
    if(item.fields) item.fields.forEach(function(f){ parts.push(f[0]+' '+f[1]); });
    if(item.sections) item.sections.forEach(function(s){ parts.push(s.h||''); if(s.steps) parts.push(s.steps.join(' ')); if(s.list) parts.push(s.list.join(' ')); });
    if(item.contacts) item.contacts.forEach(function(c){ parts.push(c[0]+' '+c[1]); });
    if(item.tips) parts.push(item.tips.join(' '));
    if(item.warns) parts.push(item.warns.join(' '));
  } else if(item.type==='table'){
    parts.push(item.desc||'');
    if(item.headers) parts.push(item.headers.join(' '));
    if(item.rows) item.rows.forEach(function(r){ parts.push(r.join(' ')); });
  } else if(item.type==='list'){
    if(item.groups) item.groups.forEach(function(g){ parts.push(g.h||''); parts.push(g.items.join(' ')); });
  } else if(item.type==='glossary'){
    if(item.terms) item.terms.forEach(function(t){ parts.push(t[0]+' '+t[1]); });
  } else if(item.type==='checklist'){
    if(item.rows) item.rows.forEach(function(r){ parts.push(r.tag+' '+r.text); });
  }
  return parts.join(' ').replace(/<[^>]+>/g,' ');
}
var SEARCH_INDEX = [];
function buildSearchIndex(){
  NAV.forEach(function(entry){
    if(entry.home) return;
    entry.items.forEach(function(p){
      var text = p.label+' '+(p.lede||'')+' '+p.refs.map(function(r){ return textOf(getItem(r[0],r[1])); }).join(' ');
      SEARCH_INDEX.push({id:p.id, group:entry.group, label:p.label, text:text.toLowerCase()});
    });
  });
}
function setupSearch(){
  var input = document.getElementById('search');
  var results = document.getElementById('searchResults');
  input.addEventListener('input', function(){
    var q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove('open'); results.innerHTML=''; return; }
    var matches = SEARCH_INDEX.filter(function(p){
      return p.label.toLowerCase().indexOf(q)!==-1 || p.text.indexOf(q)!==-1;
    }).slice(0,20);
    results.innerHTML = matches.length ?
      '<div class="sr-count">'+matches.length+'개 결과</div>'+matches.map(function(m){
        return '<a class="sr-item" onclick="selectSearchResult(\''+m.id+'\')"><div class="sr-group">'+m.group+'</div><div class="sr-label">'+m.label+'</div></a>';
      }).join('')
      : '<div class="sr-empty">일치하는 업무가 없습니다</div>';
    results.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.searchbox')) results.classList.remove('open');
  });
}
function selectSearchResult(id){
  document.getElementById('search').value = '';
  document.getElementById('searchResults').classList.remove('open');
  navigate(id);
}
function setupMobileNav(){
  var btn = document.getElementById('menuBtn');
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  btn.addEventListener('click', function(){
    sidebar.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  scrim.addEventListener('click', function(){
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
  });
}
function currentIdFromHash(){
  var h = location.hash.replace(/^#\/?/,'');
  if(h.split('/')[0]==='ops') return h;   /* ops.js patch */
  if(h.split('/')[0]==='settle') return h;   /* settle patch */
  return h || 'home';
}
function navigate(id){
  if(location.hash === '#/'+id){ renderRoute(id); } else { location.hash = '#/'+id; }
}
function renderRoute(id){
  /* ops.js patch — 상세 업무 처리 탭 · settle patch — 정산 업무 탭 */
  var head = id.split('/')[0];
  var isOps = head==='ops', isSettle = head==='settle';
  document.body.classList.toggle('ops-mode', isOps);
  document.body.classList.toggle('settle-mode', isSettle);
  var cur = isOps ? 'ops' : (isSettle ? 'settle' : 'manual');
  document.querySelectorAll('#tabbar button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tab')===cur);
  });
  if(isSettle){
    document.getElementById('pageBody').innerHTML = renderSettle();
    document.getElementById('content').scrollTop = 0;
    window.scrollTo(0,0);
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
    return;
  }
  if(isOps){
    document.getElementById('pageBody').innerHTML = renderOps();
    document.getElementById('content').scrollTop = 0;
    window.scrollTo(0,0);
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
    return;
  }
  var ok = id==='home' || !!findPage(id);
  if(!ok) id = 'home';
  document.getElementById('pageBody').innerHTML = (id==='home') ? renderHome() : renderPage(id);
  document.getElementById('content').scrollTop = 0;
  window.scrollTo(0,0);
  initChecklists();
  updateActiveNav(id);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  var cards = document.querySelectorAll('#pageBody .card:not(.static)');
  if(cards.length>1) cards[0].classList.add('open');
}
function init(){
  buildSearchIndex();
  setupNav();
  setupSearch();
  setupMobileNav();
  document.getElementById('pageBody').addEventListener('click', function(e){
    var t = e.target.closest('#expandAll,#collapseAll,#printBtn');
    if(!t) return;
    if(t.id==='expandAll') document.querySelectorAll('#pageBody .card:not(.static)').forEach(function(c){ c.classList.add('open'); });
    if(t.id==='collapseAll') document.querySelectorAll('#pageBody .card:not(.static)').forEach(function(c){ c.classList.remove('open'); });
    if(t.id==='printBtn') window.print();
  });
  window.addEventListener('hashchange', function(){ renderRoute(currentIdFromHash()); });
  renderRoute(currentIdFromHash());
}
init();
</script>

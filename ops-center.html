<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상세 업무 처리 · 실행 센터</title>
<meta name="description" content="업무 유형 · 서비스 · 통신사를 고르면 스킬 사용법과 실행 버튼이 나오는 운영팀 실행 센터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 상세 업무 처리 — 실행 모델 공통 스타일. 매뉴얼 사이트(ops-manual) 토큰과 같은 값을 쓴다. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4;
  --ink:#1a2230; --ink-muted:#5c6675; --ink-faint:#8a93a1;
  --border:#e1e5ea; --border-strong:#c7ced7;
  --accent:#0f5c56; --accent-ink:#0a3f3b; --accent-soft:#e3f1ee; --accent-soft-border:#bcdcd5;
  --warn:#a5540d; --warn-soft:#fbf1e4; --warn-soft-border:#eccb9a;
  --danger:#a3311f; --danger-soft:#fbeeec; --danger-soft-border:#eeb9ad;
  --info:#2b5a8a; --info-soft:#eaf1f8; --info-soft-border:#bcd0e6;
  --shadow:0 1px 2px rgba(20,30,40,.04),0 8px 24px -12px rgba(20,30,40,.12);
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.6 'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body.embedded{background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}
body.embedded .wrap{padding:16px 14px 24px}
a{color:var(--accent-ink)}
code,.mono{font-family:var(--mono);font-size:12.5px}
h1{font-size:22px;line-height:1.35;margin:4px 0 6px}
h2{font-size:15.5px;margin:0}
h3{font-size:13.5px;margin:14px 0 6px;color:var(--ink-muted)}
p{margin:6px 0}
.muted{color:var(--ink-muted)} .faint{color:var(--ink-faint)} .small{font-size:12.5px}
.crumb{font-size:12px;color:var(--ink-faint)}
.lede{color:var(--ink-muted);font-size:14px;max-width:70ch}

/* 머리 */
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap}
.badge.web{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-ink)}
.badge.chrome{background:var(--info-soft);border-color:var(--info-soft-border);color:var(--info)}
.badge.warn{background:var(--warn-soft);border-color:var(--warn-soft-border);color:var(--warn)}
.badge.danger{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger)}

.ctx{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0 4px;padding:10px 14px;border:1px solid var(--border);
  border-radius:12px;background:var(--surface)}
.ctx-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctx-k{font-size:11.5px;font-weight:600;color:var(--ink-faint);margin-right:2px}
.chip{appearance:none;display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 단계 */
.step{border:1px solid var(--border);border-radius:14px;background:var(--surface);margin:14px 0;box-shadow:var(--shadow)}
.step>header,.step>summary>header{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}
.step>summary>header .where{margin-left:auto}
.step .n{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:#fff;font:600 12px var(--mono)}
.step>header .where{margin-left:auto}
.step>.body{padding:14px 16px}
.step.muted-step .n{background:var(--ink-faint)}
details.step>summary{list-style:none;cursor:pointer}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary header{border-bottom:0}
details.step[open]>summary header{border-bottom:1px solid var(--border)}
details.step>summary .chev{margin-left:8px;color:var(--ink-faint);transition:transform .15s}
details.step[open]>summary .chev{transform:rotate(90deg)}

/* 폼 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink-muted)}
.field>small{font-size:11.5px;color:var(--ink-faint)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);
  border-radius:8px;padding:7px 9px}
textarea{min-height:90px;resize:vertical;line-height:1.55}
textarea.code,.prompt textarea{font-family:var(--mono);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}

.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--ink);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.small{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.done{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 파일 */
.drop{border:1.5px dashed var(--border-strong);border-radius:12px;padding:14px;text-align:center;background:var(--surface-2);
  color:var(--ink-muted);font-size:13px;cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
.drop .files{margin-top:6px;font-size:12px;color:var(--accent-ink);word-break:break-all}

/* 요청문 */
.prompt{border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:10px}
.prompt .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.prompt .ph b{font-size:12.5px}
.prompt textarea{min-height:150px;background:var(--surface)}
.prompt .attach{font-size:12px;color:var(--ink-muted);margin:8px 0 0}
.prompt .attach li{margin:2px 0}

/* 표 */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:520px}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--ink-muted);white-space:nowrap;z-index:1}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.pre{white-space:pre-wrap}
.tbl tr.bad td{background:var(--danger-soft)}
.tbl tr.warn td{background:var(--warn-soft)}
.tbl tr.ok td{background:var(--accent-soft)}
.tbl input,.tbl select{padding:4px 6px;font-size:12.5px}

/* 알림 */
.note{border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;border:1px solid var(--border);background:var(--surface-2)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-soft-border);color:#6b3a08}
.note.danger{background:var(--danger-soft);border-color:var(--danger-soft-border);color:#6e2114}
.note.ok{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-ink)}
.note.info{background:var(--info-soft);border-color:var(--info-soft-border);color:#1e3f63}
.note ul{margin:4px 0 0;padding-left:18px}

/* 체크리스트 */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.checks li:last-child{border-bottom:0}
.checks input{margin-top:4px;accent-color:var(--accent)}
.checks li.done span{color:var(--ink-faint);text-decoration:line-through}
.progress{font:600 11.5px var(--mono);color:var(--ink-faint)}

/* 링크 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 12px;font-size:13px}
.links a,.links .missing{display:flex;gap:6px;align-items:baseline;padding:4px 0;text-decoration:none;min-width:0}
.links a:hover span{text-decoration:underline}
.links a span,.links .missing span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links .missing{color:var(--ink-faint)}

.out{white-space:pre-wrap;font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:6px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-faint);font-weight:600}
.kv dd{margin:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs figure{margin:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2);font-size:11px}
.thumbs img{display:block;width:100%;height:90px;object-fit:contain;background:#fff}
.thumbs figcaption{padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-faint);padding:8px 12px;
  border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.hidden{display:none!important}

#kit-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:min(92vw,560px);z-index:50}
#kit-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  h1{font-size:19px}
  .step>header{flex-wrap:wrap}
  .step>header .where{margin-left:0}
}
@media print{.btn,.drop,.prompt .ph{display:none}.step{box-shadow:none}}

/* 메인으로 가기 */
.home-bar{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.home-bar .sp{flex:1}
.home-btn{
  appearance:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-muted);
  font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;
}
.home-btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.home-fab{
  position:fixed;right:18px;bottom:18px;z-index:40;display:none;
  box-shadow:0 6px 20px -8px rgba(20,30,40,.45);background:var(--surface)
}
.home-fab.on{display:inline-flex}
@media print{.home-bar,.home-fab{display:none!important}}
</style>
<style>
  .picker{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:4px 16px;margin:16px 0 18px}
  .p-row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
  .p-row:last-child{border-bottom:0}
  .p-label{flex:0 0 104px;font-size:12.5px;font-weight:600;color:var(--ink-muted);padding-top:5px;display:flex;gap:7px;align-items:center}
  .dep{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;font:600 11px var(--mono)}
  .p-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip .n{font:11px var(--mono);color:var(--ink-faint);margin-left:5px}
  .chip.on .n{color:rgba(255,255,255,.75)}
  .chip.empty{opacity:.4}
  .sec-h{display:flex;align-items:center;gap:9px;margin:26px 0 10px}
  .sec-h h2{font-size:17px}
  .sec-h .spacer{flex:1}
  .skill-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .skill-tab{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
  .skill-tab small{display:block;font-size:11px;color:var(--ink-faint)}
  .skill-tab.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .panel{border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
  .panel>.ph{padding:16px 18px;border-bottom:1px solid var(--border)}
  .panel>.pb{padding:16px 18px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
  .cols h3{margin-top:2px}
  ol.steps{margin:0;padding-left:20px;font-size:13.5px}
  ol.steps li{margin:4px 0}
  ul.plain{margin:0;padding-left:18px;font-size:13.5px}
  ul.plain li{margin:3px 0}
  ul.cautions li::marker{color:var(--danger)}
  .run{border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:12px 14px;margin:12px 0}
  .run-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .run-h b{font-size:14px}
  .run textarea{margin-top:8px;min-height:120px;font-family:var(--mono);font-size:12.3px;background:var(--surface)}
  .run .attach{font-size:12.5px;color:var(--ink-muted);margin:8px 0 0}
  .run .attach ul{margin:2px 0 0;padding-left:18px}
  .btn.run-btn{padding:9px 18px;font-size:14px}
  .run.locked{opacity:.7}
  .sc-chip{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--info-soft);border:1px solid var(--info-soft-border);color:var(--info)}
  .sc-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--ink-muted)}
  .sc-line .sc-state{flex:1;min-width:220px}
  .tool-part{border-top:1px dashed var(--border-strong);padding-top:12px;margin-top:14px}
  .tool-part h3{margin:0 0 4px;color:var(--ink);font-size:14px}
  .outbox{margin:8px 0}
  .outbox .out{max-height:260px;overflow:auto}
  .notes{margin:8px 0 0;padding:0;list-style:none}
  .notes li{font-size:13px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);margin:5px 0;border-radius:0 8px 8px 0}
  .warn-text{color:var(--warn);font-weight:600}
  .empty-state{padding:26px;text-align:center;color:var(--ink-faint);border:1.5px dashed var(--border-strong);border-radius:12px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
  .modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 50px -10px rgba(0,0,0,.35);padding:20px 22px;max-height:90vh;overflow:auto}
  .modal h2{font-size:17px;margin-bottom:8px}
  .modal ol{padding-left:20px;font-size:14px}
  .modal ol li{margin:6px 0}
  kbd{font:600 12px var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface-2)}
  body.embedded .top .crumb,body.embedded .top h1,body.embedded .top .lede{display:none}body.embedded .top{padding-top:0;margin-top:0}body.embedded .top .picker{margin-top:0}
  @media (max-width:760px){.cols{grid-template-columns:1fr}.p-row{flex-direction:column;gap:6px}.p-label{padding-top:0}}
</style>
<script>
/* =========================================================================
   실행 모델이 쓰는 링크 모음 — 한 곳에서만 고친다.
   url 이 null 인 항목은 페이지에 '링크 필요'로 표시된다. 받으면 여기만 채우면 된다.
   출처: 각 SKILL.md (2026-09 기준)
   ========================================================================= */
window.OPS_LINKS = {
  /* Claude */
  claude_new:        { label: 'Claude 새 대화', url: 'https://claude.ai/new' },
  claude_home:       { label: 'claude.ai', url: 'https://claude.ai' },
  chrome_ext:        { label: 'Claude in Chrome 확장 (크롬 웹 스토어)', url: 'https://chromewebstore.google.com/detail/claude/fcoeoabgfenejglbffodgkkbkcdhcgfn' },
  proj_sms:          { label: 'claude.ai 프로젝트 「월간 문자」', url: null, need: '프로젝트 주소 (claude.ai/project/…)' },
  proj_push:         { label: 'claude.ai 프로젝트 「운영팀 PUSH」', url: null, need: '프로젝트 주소 (claude.ai/project/…)' },

  /* 구글시트 · 드라이브 */
  hc_sheet:          { label: '2026년 헬스케어 데이터 관리 (구글시트)', url: 'https://docs.google.com/spreadsheets/d/1azwDHc2YTYAr80YK-cKyaZ2-AosNK9Fyt-LuAbVCf_c/edit' },
  hc_sheet_lgu:      { label: '└ LGU+ 전달용 (매월5일이내) 탭', url: 'https://docs.google.com/spreadsheets/d/1azwDHc2YTYAr80YK-cKyaZ2-AosNK9Fyt-LuAbVCf_c/edit#gid=1774131877' },
  hc_sheet_pedo:     { label: '└ 만보기_실적집계 탭', url: 'https://docs.google.com/spreadsheets/d/1azwDHc2YTYAr80YK-cKyaZ2-AosNK9Fyt-LuAbVCf_c/edit#gid=518660599' },
  hc_sheet_ot:       { label: '└ 오버테이크 탭', url: 'https://docs.google.com/spreadsheets/d/1azwDHc2YTYAr80YK-cKyaZ2-AosNK9Fyt-LuAbVCf_c/edit#gid=1115261290' },
  lgu_ga_forms:      { label: 'LGU+ 전달 양식 폴더 (드라이브)', url: 'https://drive.google.com/drive/folders/1WrHE6WfbxP-eBRxblYM4SqmJnrhnFSoJ' },
  skt_push_ctr:      { label: 'SKT 빌레터 생활건강 PUSH 클릭율 데이터 (시트)', url: null, need: '구글시트 주소' },
  cardnews_script:   { label: '건강뉴스 스크립트 (헬스케어) — 구글 슬라이드', url: 'https://docs.google.com/presentation/d/19P6ZrG_wjHI8t2uDkDSycuPc2Dvs99N_DtrefMzhGk8/edit' },
  quiz_form:         { label: '퀴즈 등록 양식.xlsx (드라이브)', url: 'https://drive.google.com/file/d/1RpIONK2IeerZ73TyH6gb-Sr2vb0W-NjP/view' },
  quiz_history:      { label: '건강퀴즈 내역 시트', url: null, need: '구글시트 주소' },
  hc_ops_folder:     { label: '03. 헬스케어 › 03.운영 (드라이브)', url: 'https://drive.google.com/drive/folders/1aQ7XeI0AYa5JcZQ1-7STFQVeoVmKe5qk' },

        '<textarea spellcheck="false" aria-label="요청문 (직접 고쳐도 됩니다)"></textarea>' +
        '<div class="attach"></div>' +
      '</div>');
    host.appendChild(box);
    var ta = K.$('textarea', box), att = K.$('.attach', box), edited = false;
    ta.addEventListener('input', function () { edited = true; });
    var api = {
      refresh: function () {
        if (!edited) ta.value = o.build();
        var files = o.attach ? o.attach() : [];
        att.innerHTML = files && files.length
          ? '<b>Claude 대화에 첨부할 파일</b><ul>' + files.map(function (f) { return '<li>' + K.esc(f) + '</li>'; }).join('') + '</ul>'
          : '';
        if (o.target === 'chrome') att.innerHTML += '<p class="faint small" style="margin:6px 0 0">크롬에서 대상 사이트 탭을 앞에 두고 → Claude 확장 사이드 패널 열기 → 붙여넣기 → 보내기. 로그인·되돌리기 어려운 버튼은 직접 확인합니다.</p>';
      },
      reset: function () { edited = false; api.refresh(); },
      text: function () { return ta.value; }
    };
    K.$('[data-act=copy]', box).addEventListener('click', function (e) { api.refresh(); K.copy(ta.value, e.currentTarget); });
    var run = K.$('[data-act=run]', box);
    if (run) run.addEventListener('click', function () { api.refresh(); K.openClaude(ta.value, { project: o.project }); });
    api.refresh();
    return api;
  };

  /* ---------- 파일 입력 ---------- */
  K.fileDrop = function (host, o) {
    var d = K.el('<div class="drop" tabindex="0" role="button"><b>' + K.esc(o.label) + '</b><br><span class="faint small">' +
      K.esc(o.hint || '끌어다 놓거나 눌러서 선택') + '</span><div class="files"></div>' +
      '<input type="file" hidden ' + (o.multiple ? 'multiple ' : '') + (o.accept ? 'accept="' + o.accept + '"' : '') + '></div>');
    host.appendChild(d);
    var inp = K.$('input', d), list = K.$('.files', d);
    var take = function (fl) {
      var files = Array.prototype.slice.call(fl || []);
      if (!files.length) return;
      list.textContent = files.map(function (f) { return f.name; }).join(', ');
      Promise.resolve(o.onFiles(o.multiple ? files : files[0])).catch(function (e) { K.toast(e.message || String(e), 5000); console.error(e); });
    };
    d.addEventListener('click', function (e) { if (e.target !== inp) inp.click(); });
    d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
    inp.addEventListener('change', function () { take(inp.files); inp.value = ''; });
    d.addEventListener('dragover', function (e) { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', function () { d.classList.remove('over'); });
    d.addEventListener('drop', function (e) { e.preventDefault(); d.classList.remove('over'); take(e.dataTransfer.files); });
    return { clear: function () { list.textContent = ''; } };
  };

  /* ---------- 체크리스트 (브라우저에만 저장) ---------- */
  K.checklist = function (host, key, items) {
    var state = K.store.get('chk:' + key, {});
    var ul = K.el('<ul class="checks"></ul>');
    var prog = K.el('<div class="progress"></div>');
    items.forEach(function (it, i) {
      var li = K.el('<li><input type="checkbox" id="c-' + key + '-' + i + '"><label for="c-' + key + '-' + i + '"><span>' + it + '</span></label></li>');
      var cb = K.$('input', li); cb.checked = !!state[i]; li.classList.toggle('done', cb.checked);
      cb.addEventListener('change', function () { state[i] = cb.checked; li.classList.toggle('done', cb.checked); K.store.set('chk:' + key, state); upd(); });
      ul.appendChild(li);
    });
    function upd() { var n = items.filter(function (_, i) { return state[i]; }).length; prog.textContent = n + ' / ' + items.length + ' 완료'; }
    host.appendChild(prog); host.appendChild(ul); upd();
    return { reset: function () { state = {}; K.store.set('chk:' + key, state); K.$$('input', ul).forEach(function (c) { c.checked = false; c.closest('li').classList.remove('done'); }); upd(); } };
  };

  /* ---------- 링크 ---------- */
  K.linkHTML = function (key) {
    var l = (window.OPS_LINKS || {})[key];
    if (!l) return '';
    if (!l.url) return '<span class="missing" title="' + K.esc(l.need || '') + '">🔗 <span>' + K.esc(l.label) + '</span> <em class="badge warn">링크 필요</em></span>';
    return '<a href="' + K.esc(l.url) + '" target="_blank" rel="noopener">↗ <span>' + K.esc(l.label) + '</span></a>';
  };
  K.links = function (host, keys) { host.innerHTML = '<div class="links">' + keys.map(K.linkHTML).join('') + '</div>'; };
  K.url = function (key) { var l = (window.OPS_LINKS || {})[key]; return l && l.url; };

  /* ---------- 페이지 머리 ---------- */
  var WHERE = {
    web: ['web', 'claude.ai 웹 채팅'],
    chrome: ['chrome', 'Claude in Chrome (담당자 크롬)'],
    both: ['chrome', '웹 채팅 + 크롬']
  };
  K.ctx = { service: Q.get('service') || '', telco: Q.get('telco') || '' };
  var ctxFns = [];
  K.onCtx = function (fn) { ctxFns.push(fn); };
  function fireCtx() { ctxFns.forEach(function (f) { try { f(K.ctx); } catch (e) { console.error(e); } }); }

  K.page = function (cfg) {
    K.cfg = cfg;
    if (window.self !== window.top || Q.get('embed')) document.body.classList.add('embedded');
    var head = K.$('#kit-head');
    var services = cfg.services === '*' ? ['헬스케어', '안심클라우드', '마인드케어', '투데이', '운세당'] : cfg.services;
    var telcos = cfg.telcos === '*' ? ['SKT', 'KT', 'LGU+'] : cfg.telcos;
    if (services.indexOf(K.ctx.service) < 0) K.ctx.service = cfg.defaultService || services[0];
    if (telcos.indexOf(K.ctx.telco) < 0) K.ctx.telco = cfg.telcoAll ? '' : (cfg.defaultTelco || telcos[0]);
    var w = WHERE[cfg.where] || WHERE.web;

    var chips = function (name, vals, cur, allLabel) {
      var all = allLabel ? '<button type="button" class="chip' + (cur ? '' : ' on') + '" data-k="' + name + '" data-v="">' + allLabel + '</button>' : '';
      return all + vals.map(function (v) { return '<button type="button" class="chip' + (v === cur ? ' on' : '') + '" data-k="' + name + '" data-v="' + K.esc(v) + '">' + K.esc(v) + '</button>'; }).join('');
    };
    head.innerHTML =
      '<div class="crumb">상세 업무 처리 · ' + K.esc(cfg.type) + '</div>' +
      '<h1>' + K.esc(cfg.title) + '</h1>' +
      '<p class="lede">' + cfg.desc + '</p>' +
      '<div class="meta"><span class="badge ' + w[0] + '">실행 · ' + w[1] + '</span>' +
        '<span class="badge">주기 · ' + K.esc(cfg.cycle) + '</span>' +
        '<span class="badge mono">' + K.esc(cfg.id) + '</span></div>' +
      (services.length > 1 || telcos.length > 1 || cfg.telcoAll ?
        '<div class="ctx">' +
          (services.length > 1 ? '<div class="ctx-group"><span class="ctx-k">서비스</span>' + chips('service', services, K.ctx.service) + '</div>' : '<div class="ctx-group"><span class="ctx-k">서비스</span><span class="chip on">' + K.esc(services[0]) + '</span></div>') +
          (telcos.length > 1 || cfg.telcoAll ? '<div class="ctx-group"><span class="ctx-k">통신사</span>' + chips('telco', telcos, K.ctx.telco, cfg.telcoAll) + '</div>' : '<div class="ctx-group"><span class="ctx-k">통신사</span><span class="chip on">' + K.esc(telcos[0]) + '</span></div>') +
        '</div>' : '');

    K.$$('.ctx .chip[data-k]', head).forEach(function (b) {
      b.addEventListener('click', function () {
        K.ctx[b.dataset.k] = b.dataset.v;
        K.$$('.ctx .chip[data-k="' + b.dataset.k + '"]', head).forEach(function (x) { x.classList.toggle('on', x === b); });
        fireCtx();
      });
    });

    /* 처음 한 번 준비 */
    var setupItems = [];
    setupItems.push('claude.ai에 회사 계정으로 로그인했다 (<a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a>)');
    setupItems.push('스킬 <code>' + K.esc(cfg.id) + '</code>을 claude.ai › 사용자 지정 › 스킬에 올렸다 — <a href="../skills/' + cfg.id + '.zip" download>스킬 파일(.zip) 받기</a>');
    if (cfg.where !== 'chrome') setupItems.push('claude.ai › 설정 › 기능에서 <b>코드 실행 및 파일 생성</b>을 켰다' + (cfg.needSearch ? ' (웹 검색도 켬)' : ''));
    if (cfg.where !== 'web') {
      setupItems.push('크롬에 Claude 확장을 설치하고 같은 계정으로 로그인했다 — ' + K.linkHTML('chrome_ext'));
      setupItems.push('확장이 사이트 접근을 물으면 아래 <b>사용 사이트</b>만 허용한다');
    }
    (cfg.setup || []).forEach(function (s) { setupItems.push(s); });
    var setup = K.el(
      '<details class="step muted-step" id="kit-setup"><summary><header><span class="n">0</span><h2>처음 한 번 준비</h2>' +
      '<span class="chev">›</span><span class="where faint small">한 번 해 두면 다음부터 건너뜀</span></header></summary><div class="body"></div></details>');
    var sb = K.$('.body', setup);
    K.checklist(sb, 'setup:' + cfg.id, setupItems);
    if (cfg.sites && cfg.sites.length) {
      sb.appendChild(K.el('<h3>사용 사이트 (크롬 확장 접근 허용 대상)</h3>'));
      sb.appendChild(K.el('<div class="small">' + cfg.sites.map(function (s) { return '<code>' + K.esc(s) + '</code>'; }).join(' · ') + '</div>'));
    }
    if (cfg.links && cfg.links.length) {
      sb.appendChild(K.el('<h3>자료 · 바로가기</h3>'));
      var lh = document.createElement('div'); K.links(lh, cfg.links); sb.appendChild(lh);
    }
    head.appendChild(setup);
    if (!K.store.get('setup-seen:' + cfg.id)) { setup.open = true; K.store.set('setup-seen:' + cfg.id, 1); }
    autoHeight();
  };

  /* ---------- 매뉴얼 iframe 높이 맞추기 ---------- */
  function autoHeight() {
    if (window.self === window.top) return;
    var last = 0;
    var send = function () {
      var h = Math.ceil(document.documentElement.scrollHeight);
      if (Math.abs(h - last) < 4) return; last = h;
      try { parent.postMessage({ type: 'ops-model-height', id: K.cfg && K.cfg.id, height: h }, '*'); } catch (e) { /* 부모 없음 */ }
    };
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
    window.addEventListener('load', send); setTimeout(send, 300);
  }

  /* ---------- 단계 상자 도우미 ---------- */
  K.tabs = function (host) {
    var btns = K.$$('.tabs button', host);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (x) { x.classList.toggle('on', x === b); K.$('#' + x.dataset.tab).classList.toggle('hidden', x !== b); });
      });
    });
  };
})();

</script>
<script>

   ========================================================================= */
(function () {

<script>
/* =========================================================================

(function () {

  };

  /* ================================================================ LGU+ PUSH 예정표 */
  T.lguPush = function (api) {
    var st = api.st, h = api.host;
    var BIRTH = {
      '30S': [[1997, 1996, 1995, 1994, 1993, 1992], [1992, 1991, 1990, 1989, 1988]],
      '40S': [[1987, 1986, 1985, 1984, 1983, 1982], [1982, 1981, 1980, 1979, 1978]],
      '50S': [[1977, 1976, 1975, 1974, 1973, 1972], [1972, 1971, 1970, 1969, 1968]],

    };
    var plan = [], rows = [], shift = null, blocked = true, fileName = '';
    var up = box(h, '발송계획 올리기 → 등록 예정표', '통신사 <b>확정본</b> 발송계획 엑셀(시트 「CP사 발송 마케팅 PUSH」, 5행부터)을 올리면 계획 1행을 등록 2건으로 바꿉니다.');
    K.fileDrop(up, { label: '발송계획 엑셀(.xlsx) 올리기', accept: '.xlsx,.xlsm', onFiles: function (f) { fileName = f.name; return K.readWorkbook(f).then(parse); } });
    var msg = K.el('<div></div>'); up.appendChild(msg);
    var yearBox = K.el('<div></div>'); up.appendChild(yearBox);

    var ap = K.el('<div class="hidden" style="margin-top:10px">' +
      '<label class="inline"><input type="checkbox" data-a="1"> 올린 파일이 <b>통신사 확정본</b>이다</label><br>' +
      '<label class="inline"><input type="checkbox" data-a="2"> 예정표의 날짜·시간·타겟·문구를 확인했고 <b>등록을 승인</b>한다</label>' +
      '<div class="row" style="margin-top:8px"><button class="btn" type="button" data-x="xlsx" disabled>예정표 엑셀 받기</button></div></div>');
    up.appendChild(ap);
    var fin = box(h, '등록 후 마무리', '');
    fin.innerHTML = '<div class="grid" style="max-width:520px"><label class="field"><span>관리자 목록의 대상 월 등록 건수</span><input type="number" min="0" data-c></label>' +
      '<div class="field"><span>기대 건수 (계획 행 × 2)</span><div class="mono" data-exp style="padding:7px 0">—</div></div></div><div data-cm></div>';
    K.checklist(fin, 'lgu-push-verify', [
      '상세 화면 값이 예정표와 같다 (발송일·시간·제목·내용·성별·연령·생년·제한건수·utm_id)',
      '앱 링크가 <code>/view/pedometer/main</code>이다 (제목이 앱 링크 칸에 들어간 사례 있음)',
      '같은 날 2건의 발송시간이 서로 다르다',
      '같은 날 2건의 생년 목록이 1차(젊은 6개)/2차(나이 많은 5개)로 갈렸다',
      '틀린 건은 READY 상태에서 상세 › [수정]으로 고쳤다 (삭제는 확인 후에만)'
    ]);
    $('[data-c]', fin).addEventListener('input', function () {
      var n = +this.value, e = rows.length;
      $('[data-cm]', fin).innerHTML = !this.value || !e ? '' : n === e ? note('ok', '건수가 맞습니다 (' + n + '건).') : note('danger', '건수가 다릅니다: 목록 ' + n + '건 / 기대 ' + e + '건. 누락·중복을 확인하세요.');
    });

    function parseSlot(s) {
      var m = String(s).replace(/\s/g, '').match(/(\d{1,2})(?::?(\d{2}))?시?[~\-–](\d{1,2})(?::?(\d{2}))?/);
      if (!m) return null;
      var a = (+m[1]) * 60 + (+(m[2] || 0)), b = (+m[3]) * 60 + (+(m[4] || 0));
      if (a === 960 && b === 1020) return ['1600', '1630'];
      if (a === 960 && b === 1080) return ['1600', '1700'];
      return null;
    }
    function parseTarget(s) { var m = String(s).match(/([3-6])0\s*대\s*(남|여)/); return m ? { age: m[1] + '0S', gender: m[2] === '남' ? '남자(1)' : '여자(2)' } : null; }
    function parseCount(v) { var s = String(v).replace(/[,\s건]/g, ''), m = s.match(/^(\d+(?:\.\d+)?)만$/); return m ? Math.round(+m[1] * 10000) : K.num(s); }

    function parse(wb) {
      var ws = wb.getWorksheet('CP사 발송 마케팅 PUSH') || wb.worksheets.find(function (w) { return /발송\s*마케팅\s*PUSH/.test(w.name); });
      if (!ws) throw new Error('시트 「CP사 발송 마케팅 PUSH」를 찾지 못했습니다. 시트: ' + wb.worksheets.map(function (w) { return w.name; }).join(', '));
      plan = [];
      for (var r = 5; r <= ws.rowCount; r++) {
        var row = ws.getRow(r), dd = K.cellDate(row.getCell(2)), text = K.cellText(row.getCell(8));
        if (!dd && !text) continue;
        plan.push({ row: r, date: dd, slot: K.cellText(row.getCell(4)), text: text.replace(/\r/g, ''), count: K.cellText(row.getCell(9)), target: K.cellText(row.getCell(10)) });
      }
      if (!plan.length) throw new Error('5행부터 읽을 회차가 없습니다.');
      shift = null; build();
    }

    function build() {
      var issues = [], years = {};
      plan.forEach(function (p) { if (p.date) years[p.date.getFullYear()] = 1; });
      var year = +Object.keys(years)[0] || 2026, sh = year - 2026;
      if (sh !== 0) {
        yearBox.innerHTML = note('warn', '<b>발송 연도가 ' + year + '년입니다.</b> 생년 표는 2026년 기준이라 그대로 쓰지 않습니다. 관리자에서 직전 등록 건의 상세 생년 목록을 확인하고 고르세요.<div class="row" style="margin-top:6px">' +
          '<label class="inline"><input type="radio" name="lp-shift" value="0"' + (shift === 0 ? ' checked' : '') + '> 2026 표 그대로</label>' +
          '<label class="inline"><input type="radio" name="lp-shift" value="' + sh + '"' + (shift === sh ? ' checked' : '') + '> ' + (sh > 0 ? '+' : '') + sh + '년 이동</label></div>');
        $$('input[name=lp-shift]', yearBox).forEach(function (i) { i.addEventListener('change', function () { shift = +i.value; build(); }); });
      } else { yearBox.innerHTML = ''; shift = 0; }
      rows = [];
      plan.forEach(function (p, idx) {
        var lines = p.text.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        var slot = p.manual || parseSlot(p.slot), tg = parseTarget(p.target), cnt = parseCount(p.count), prob = [];

        if (lines.length !== 3) prob.push('문구가 3줄이 아님(' + lines.length + '줄)');
        if (lines[0] && lines[0].indexOf('(광고)') < 0) prob.push('제목에 (광고) 없음');

        if (K.hasEmoji(p.text)) prob.push('이모티콘 포함');

        [0, 1].forEach(function (k) {
          rows.push({

            utm: p.date ? 'utm_medium=UPASS&utm_source=push&utm_id=' + K.fmt(p.date, 'YYMMDD') : '', bad: prob.length > 0
          });
        });
      });
      blocked = issues.length > 0 || shift === null;
      var months = {}; plan.forEach(function (p) { if (p.date) months[K.fmt(p.date, 'YYYY년 M월')] = 1; });

        (issues.length ? note('danger', '<b>확인이 필요한 행 ' + issues.length + '개</b> — 해결 전에는 승인할 수 없습니다.<ul>' + issues.map(function (x) {
          return '<li>' + x.p.row + '행 (' + esc(K.iso(x.p.date)) + '): ' + x.prob.map(esc).join(' · ') +
            (x.slot ? ' <input type="text" class="mono" style="width:120px;display:inline-block" placeholder="1600,1700" data-slot="' + x.i + '">' : '') + '</li>';
        }).join('') + '</ul><p class="small" style="margin:6px 0 0">문구·건수는 고치지 말고 담당자에게 알립니다(계획에 없는 수정 금지). 시간대는 확인 후 칸에 1차,2차 시간을 넣으세요.</p>')
          : note('ok', '모든 행을 규칙대로 바꿨습니다. 표를 눈으로 확인하고 승인하세요.'));

      return { a: 'reg', next: next, time: K.fmt(t5, 'HHmm'), why: fail > 0 ? '직전 회차 실패 ' + fail + '건으로 중지되어 재개' : '한도 도달', t: '<b>등록</b> — 일련번호 <b class="mono">' + next + '</b>부터 30,000건, 발송시간 <b class="mono">' + K.fmt(t5, 'HHmm') + '</b> (' + (fail > 0 ? '실패 지점 재개' : '한도 도달') + ')' };
    }
    function render() {
      var rs = rows();
      $$('tr[data-i]', b).forEach(function (tr, i) {
        var d = decide(rs[i], i), c = S.ch[i] || {};
        $('[data-out]', tr).innerHTML = d.t; tr.className = d.a === 'reg' ? 'ok' : d.a === 'stop' ? 'bad' : d.a === 'end' ? 'warn' : '';
        $('[data-cnt]', tr).textContent = (c.round || 0) + '회차' + (c.ended ? ' · 종료' : '');
      });
      var ended = CH.filter(function (_, i) { return (S.ch[i] || {}).ended; }).length;
      $('[data-g]', b).innerHTML = ended === 6 ? note('ok', '6개 채널이 모두 종료됐습니다 — 전체 완료 보고를 올리세요.') : '';
      sumOut.set(summary());
      var last = S.log.length ? S.log[S.log.length - 1].at : null;
      $('[data-next]', b).textContent = last ? '마지막 기록 ' + last + ' · 다음 확인 ' + K.fmt(new Date(K.parseDate(day).getTime() + (+last.slice(0, 2) * 60 + +last.slice(3, 5) + 30) * 60000), 'HH:mm') : '';
    }
    function summary() {
      var rs = rows();
      return CH.map(function (c, i) {
        var d = decide(rs[i], i), s = S.ch[i] || {};
        if (d.a === 'reg') return '[' + c[0] + '·' + c[1] + '] ' + ((s.round || 0) + 1) + '회차 등록 — 일련번호 ' + d.next + '부터 30,000건, ' + d.time.slice(0, 2) + ':' + d.time.slice(2) + ' 발송 예정 (' + d.why + ')';
        return '[' + c[0] + '·' + c[1] + '] ' + (d.t ? d.t.replace(/<[^>]+>/g, '') : '미확인');
      }).join('\n');
    }
    b.addEventListener('input', render); b.addEventListener('change', render);
    $('[data-rec]', b).addEventListener('click', function () {
      var rs = rows(), at = K.fmt(K.now(), 'HH:mm');
      rs.forEach(function (o, i) {
        var d = decide(o, i), c = S.ch[i] = S.ch[i] || {};
        if (d.a === 'wait') c.busy = (c.busy || 0) + 1; else if (o.st) c.busy = 0;
        if (d.a === 'end') c.ended = true;
        if (d.a === 'reg') {
          c.zero = K.num(o.ok) === 0 ? (c.zero || 0) + 1 : 0; c.round = (c.round || 0) + 1; c.lastSerial = d.next;
          S.log.push({ at: at, sys: CH[i][0], tel: CH[i][1], round: c.round, serial: d.next, lim: 30000, time: d.time, why: d.why });
        }
      });
      if (!S.log.length || S.log[S.log.length - 1].at !== at) S.log.push({ at: at, check: true });
      K.store.set(key, S); render(); K.toast('기록했습니다. 30분 뒤 다시 확인하세요.');
    });
    $('[data-exp]', b).addEventListener('click', function (e) {
      K.copy(K.tsv([['일시', '시스템', '통신사', '회차', '일련번호', '발송제한건수', '발송예정시각', '사유']].concat(S.log.filter(function (l) { return !l.check; }).map(function (l) { return [day + ' ' + l.at, l.sys, l.tel, l.round, l.serial, l.lim, l.time, l.why]; }))), e.currentTarget);

    var INC = /\/join|조회하기|확인하기|가입 후 이용|지원금|쿠폰|안심/, EXC = /게임|대출|보험|렌탈|분양|채용|교육|카지노/;

    var sOut = outBox(sc, 'window.__scan', function () { return window.OPS_GDN_SCANNER; }); sOut.set(window.OPS_GDN_SCANNER.split('\n').slice(0, 3).join('\n') + '\n…');

      '<label class="field"><span>가입창 기록 JSON (선택)</span><textarea class="code" data-l></textarea></label></div><div class="row" style="margin:6px 0"><button class="btn primary small" type="button" data-go>정리하기</button></div><div data-r></div>';
    function clean(u) {
      try { var x = new URL(u); var q = x.search.slice(1).split('&'), keep = []; for (var i = 0; i < q.length; i++) { if (/^(gclid|gad_source|gad_campaignid)=/.test(q[i])) break; if (q[i]) keep.push(q[i]); } x.search = keep.length ? '?' + keep.join('&') : ''; return x.toString(); } catch (e) { return u; }
    }
    function known(u) { for (var i = 0; i < KNOWN.length; i++) if (KNOWN[i][0].test(u)) return KNOWN[i]; return null; }
    function run() {
      try { ads = [].concat(K.extractJSON($('[data-a]', b).value)); } catch (e) { $('[data-r]', b).innerHTML = note('danger', '광고 JSON: ' + esc(e.message)); return; }
      var lt = $('[data-l]', b).value.trim(); lands = [];
      if (lt) { try { lands = [].concat(K.extractJSON(lt)); } catch (e) { $('[data-r]', b).innerHTML = note('danger', '가입창 JSON: ' + esc(e.message)); return; } }
      ads.forEach(function (a) { var t = (a.txt || '') + ' ' + (a.full || ''); a._cand = INC.test(t) && !EXC.test(a.txt || ''); a._clean = clean(a.full || ''); a._k = known(a._clean); a._use = a._cand; });
      render();
    }
    function render() {
      var byTag = {}; ads.forEach(function (a) { var t = a.tag || '(지면 미상)'; byTag[t] = byTag[t] || { all: 0, cand: 0 }; byTag[t].all++; if (a._use) byTag[t].cand++; });
      $('[data-r]', b).innerHTML = '<p class="small">지면별: ' + Object.keys(byTag).map(function (t) { return esc(t) + ' 수집 ' + byTag[t].all + ' / 후보 ' + byTag[t].cand; }).join(' · ') + '</p>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>포함</th><th>지면</th><th>소재 문구</th><th>외부가입창 URL (추적값 제거)</th><th>알려진 서비스</th><th class="num">노출</th></tr></thead><tbody>' +
        ads.map(function (a, i) { return '<tr class="' + (a._use ? 'ok' : '') + '"><td><input type="checkbox" data-u="' + i + '"' + (a._use ? ' checked' : '') + '></td><td class="small">' + esc(a.tag) + '</td><td class="small">' + esc((a.txt || '').slice(0, 140)) + '</td><td class="small mono" style="word-break:break-all">' + esc(a._clean) + '</td><td class="small">' + (a._k ? esc(a._k[1] + ' · ' + a._k[2] + ' · ' + a._k[3]) : '') + '</td><td class="num">' + (a.n || '') + '</td></tr>'; }).join('') + '</tbody></table></div>' +

<body>
<div class="wrap">
  <div class="top">
    <div class="crumb">서비스 운영팀 업무 매뉴얼 · 상세 업무 처리</div>
    <h1>실행 센터</h1>
    <p class="lede">업무 유형 · 서비스 · 통신사를 고르면 그 업무의 사용법과 실행 버튼이 나옵니다. [실행]을 누르면 웹 채팅 업무는 로그인된 Claude가 요청문이 채워진 채로 열리고(보내기만 누르면 됨), 브라우저 확장 업무는 작업 사이트가 열리고 사이드 패널에 단축키(/이름) 하나만 입력하면 됩니다. 파일은 이 브라우저 안에서만 읽고 만듭니다.</p>
    <div class="picker" id="picker"></div>
  </div>
  <div id="list"></div>
  <div id="detail"></div>
</div>

<script>
(function () {
  var K = Kit, $ = K.$, $$ = K.$$, esc = K.esc;
  var Q = new URLSearchParams(location.search);
  var EMBED = Q.get('embed') === '1' || window.self !== window.top;
  if (EMBED) document.body.classList.add('embedded');
  var WHERE = { web: ['web', '웹 채팅'], chrome: ['chrome', '브라우저 확장'], both: ['chrome', '웹 채팅 + 브라우저 확장'] };
  var sel = { type: null, service: null, telco: null, skill: null };

  function has(f, v) { return f === '*' || f.indexOf(v) >= 0; }
  function match(s, x) { return (!x.type || s.type === x.type) && (!x.service || has(s.services, x.service)) && (!x.telco || has(s.telcos, x.telco)); }
  function list() { return OPS_SKILLS.filter(function (s) { return match(s, sel); }); }

  /* ---------- 주소 ↔ 선택 ---------- */
  function readHash() {
    var p = location.hash.replace(/^#\/?/, '').split('/').map(function (x) { return x && x !== '-' ? decodeURIComponent(x) : null; });
    sel.type = p[0] || Q.get('type'); sel.service = p[1] || Q.get('service'); sel.telco = p[2] || Q.get('telco'); sel.skill = p[3] || Q.get('skill');
  }
  function writeHash() {
    var h = '#/' + [sel.type, sel.service, sel.telco, sel.skill].map(function (v) { return v ? encodeURIComponent(v) : '-'; }).join('/');
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  /* ---------- ①②③ ---------- */
  function renderPicker() {
    var row = function (n, label, key, vals) {
      return '<div class="p-row"><div class="p-label"><span class="dep">' + n + '</span>' + label + '</div><div class="p-chips">' + vals.map(function (v) {
        var probe = { type: sel.type, service: sel.service, telco: sel.telco }; probe[key] = v;
        if (key === 'type') { probe.service = null; probe.telco = null; }
        if (key === 'service') probe.telco = null;
        var c = OPS_SKILLS.filter(function (s) { return match(s, probe); }).length;
        return '<button type="button" class="chip' + (sel[key] === v ? ' on' : '') + (c ? '' : ' empty') + '" data-k="' + key + '" data-v="' + esc(v) + '">' + esc(v === 'LGU+' ? 'LG U+' : v) + '<span class="n">' + c + '</span></button>';
      }).join('') + '</div></div>';
    };
    $('#picker').innerHTML = row(1, '업무 유형', 'type', OPS_TYPES) + row(2, '서비스', 'service', OPS_SERVICES) + row(3, '통신사', 'telco', OPS_TELCOS);
    $$('#picker .chip').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.k, v = b.dataset.v;
        sel[k] = sel[k] === v ? null : v;
        if (k === 'type') { sel.service = null; sel.telco = null; }
        if (k === 'service') sel.telco = null;
        sel.skill = null; render();
      });
    });
  }

  /* ---------- 업무 목록 ---------- */
  function renderList() {
    var L = list();
    if (sel.skill && !L.some(function (s) { return s.id === sel.skill; })) {
      var forced = OPS_SKILLS.find(function (s) { return s.id === sel.skill; });
      if (forced && EMBED) L = [forced]; else sel.skill = null;
    }
    if (!sel.skill && L.length === 1) sel.skill = L[0].id;
    if (EMBED && sel.skill) { $('#list').innerHTML = ''; return; }
    var done = sel.type && sel.service && sel.telco;
    $('#list').innerHTML = '<div class="sec-h"><h2>' + (done ? '실행 모델' : '해당 업무') + '</h2><span class="badge">' + L.length + '개</span><span class="spacer"></span>' +
      (done ? '' : '<span class="faint small">3단계까지 고르면 범위가 좁혀집니다</span>') + '</div>' +
      (L.length ? '<div class="skill-tabs">' + L.map(function (s) {
        return '<button type="button" class="skill-tab' + (s.id === sel.skill ? ' on' : '') + '" data-id="' + s.id + '">' + esc(s.name) +
          '<small>' + esc(s.type) + ' · ' + WHERE[s.where][1] + ' · ' + esc(s.cycle) + '</small></button>';
      }).join('') + '</div>' : '<div class="empty-state">이 조합에 맞는 업무가 없습니다. 위 단계를 다시 골라 보세요.</div>');
    $$('.skill-tab').forEach(function (b) { b.addEventListener('click', function () { sel.skill = b.dataset.id; render(); scrollToDetail(); }); });
  }
  function scrollToDetail() { var d = $('#detail'); if (d && d.firstElementChild && !EMBED) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  /* ---------- ④⑤ ---------- */
  var cur = null;
  function scopeText(s) {
    return (s.services === '*' ? '전 서비스' : s.services.join(' · ')) + ' · ' + (s.telcos === '*' ? '3사 공통' : s.telcos.map(function (t) { return t === 'LGU+' ? 'LG U+' : t; }).join(' · '));
  }
  function renderDetail() {
    var s = OPS_SKILLS.find(function (x) { return x.id === sel.skill; });
    var host = $('#detail');
    if (!s) { host.innerHTML = ''; cur = null; return; }
    /* 이 업무에서 쓸 서비스·통신사 */
    var svcs = s.services === '*' ? OPS_SERVICES : s.services, tels = s.telcos === '*' ? OPS_TELCOS : s.telcos;
    K.ctx.service = sel.service && svcs.indexOf(sel.service) >= 0 ? sel.service : (K.ctx.service && svcs.indexOf(K.ctx.service) >= 0 ? K.ctx.service : svcs[0]);
    K.ctx.telco = sel.telco && tels.indexOf(sel.telco) >= 0 ? sel.telco : (K.ctx.telco && tels.indexOf(K.ctx.telco) >= 0 ? K.ctx.telco : tels[0]);
    var g = s.guide, w = WHERE[s.where];
    var saved = K.store.get('vals:' + s.id, {});
    var st = {};

  /* ---------- 실행 ---------- */
  function modal(html) {
    var bg = K.el('<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal">' + html + '<div class="row end" style="margin-top:14px"><button class="btn primary" type="button" data-close>확인</button></div></div></div>');
    document.body.appendChild(bg);
    var close = function () { bg.remove(); document.removeEventListener('keydown', esc_); };
    var esc_ = function (e) { if (e.key === 'Escape') close(); };
    $$('[data-close]', bg).forEach(function (b) { b.addEventListener('click', close); });
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    document.addEventListener('keydown', esc_);
    return bg;
  }
  /* 크롬 단축키 — 등록 여부는 이 브라우저에만 기억한다 */

      '<li>다음부터는 사이드 패널 입력창에 <code>/' + esc(sc.name) + '</code>를 입력해 실행합니다.</li></ol>' +
      '<textarea class="code" readonly style="min-height:150px">' + esc(sc.text) + '</textarea>' +

  }
  function openTab(url) { var w = window.open(url, '_blank'); if (w) { try { w.opener = null; } catch (e) { /* 무시 */ } } return !!w; }

    if (window.self === window.top) return;
    var h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - lastH) < 4) return; lastH = h;
    try { parent.postMessage({ type: 'ops-model-height', id: sel.skill, height: h }, '*'); } catch (e) { /* 부모 없음 */ }
  }
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);

  readHash(); render();
  window.addEventListener('hashchange', function () { readHash(); render(); });
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>월 정산 워크벤치</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style id="pageStyle">@page{size:A4;margin:14mm}</style>
<style>
/* 매뉴얼·실행 센터와 같은 토큰 */
:root{--bg:#f4f6f8;--panel:#ffffff;--ink:#1a2230;--muted:#5c6675;--line:#e1e5ea;--brand:#0f5c56;--brand2:#0a3f3b;--soft:#e3f1ee;--ok:#2f7d55;--okbg:#e6f2ea;--warn:#a5540d;--warnbg:#fbf1e4;--err:#a3311f;--errbg:#fbeeec;--wk:#eef1f4;--input:#ffffff;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#181d25;--ink:#e7ebf0;--muted:#a3adba;--line:#2a313c;--brand:#4fc9bc;--brand2:#bdf0e7;--soft:#173330;--ok:#6fd4a0;--okbg:#16301f;--warn:#e3a765;--warnbg:#2e2415;--err:#e08674;--errbg:#2c1a17;--wk:#1f2530;--input:#12161c}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#181d25;--ink:#e7ebf0;--muted:#a3adba;--line:#2a313c;--brand:#4fc9bc;--brand2:#bdf0e7;--soft:#173330;--ok:#6fd4a0;--okbg:#16301f;--warn:#e3a765;--warnbg:#2e2415;--err:#e08674;--errbg:#2c1a17;--wk:#1f2530;--input:#12161c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Noto Sans KR','IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif}
code,kbd,samp,.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.top label.m{display:flex;align-items:center;gap:6px;font-weight:600}
.top input[type=month]{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:12.5px;white-space:nowrap}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{border-color:var(--err);color:var(--err);background:transparent}
.btn[disabled]{opacity:.5;cursor:wait}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.navgroup{font-size:11.5px;color:var(--muted);font-weight:700;margin:14px 8px 4px;letter-spacing:.02em}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.navitem:hover{background:var(--soft)}
.navitem.on{background:var(--brand);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.prog{background:var(--warn)}.dot.done{background:var(--ok)}.dot.err{background:var(--err)}
main{padding:22px 26px 60px;max-width:1240px;width:100%}
.crumb{color:var(--muted);font-size:12.5px}
.titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 10px}
.titlebar h2{margin:0;font-size:22px}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;white-space:nowrap}
.badge.prog{background:var(--warnbg);color:var(--warn)}.badge.done{background:var(--okbg);color:var(--ok)}.badge.err{background:var(--errbg);color:var(--err)}
.copyrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.copy{border:1px dashed var(--line);background:var(--panel);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.copy b{color:var(--brand2);font-weight:600}
.copy:hover{border-color:var(--brand)}
.note{background:var(--soft);border-left:3px solid var(--brand);padding:8px 12px;border-radius:4px;margin-bottom:14px;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
ol.checks{list-style:none;margin:0;padding:0;counter-reset:s}
ol.checks li{counter-increment:s;border-bottom:1px solid var(--line)}
ol.checks li:last-child{border:0}
ol.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;cursor:pointer}
ol.checks label::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--brand2);font-size:11.5px;display:grid;place-items:center;margin-top:1px}
ol.checks input{margin-top:4px}
ol.checks input:checked~span{color:var(--muted);text-decoration:line-through}
.progress{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--ok)}
.amount{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.amount small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
dl.lines{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 10px;font-size:13px}
dl.lines dt{color:var(--muted)}dl.lines dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.msgs{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:5px}
.msgs li{padding:6px 10px;border-radius:6px;font-size:12.5px}
.msgs .e{background:var(--errbg);color:var(--err)}.msgs .w{background:var(--warnbg);color:var(--warn)}.msgs .o{background:var(--okbg);color:var(--ok)}.msgs .i{background:var(--soft);color:var(--brand2)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.paste{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-bottom:12px}
.paste textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--input);font-family:Consolas,monospace;font-size:12.5px;resize:vertical}
.mapbox{font-size:12.5px;display:grid;gap:5px;align-content:start}
.mapbox .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mapbox select,.maptbl select{padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--input)}
.help{color:var(--muted);font-size:12px}
.tablewrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:6px}
table.g{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:right;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--soft);color:var(--brand2);font-weight:600;z-index:1}
table.g tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700}
table.g td:first-child,table.g th:first-child{text-align:left}
table.g tr.wk td{background:var(--wk)}
table.g tr.miss td:first-child{color:var(--err)}
table.g input{width:88px;text-align:right;border:1px solid transparent;border-radius:4px;padding:2px 6px;background:transparent;font-variant-numeric:tabular-nums}
table.g input:hover{border-color:var(--line)}
table.g input:focus{border-color:var(--brand);background:var(--input);outline:none}
.wd{color:var(--muted);font-size:11.5px;margin-left:4px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.form label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.form input,.form select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);text-align:right}
.form select{text-align:left}
.form label.ck{display:flex;align-items:center;gap:6px;color:var(--ink)}
details.set summary,details.sub summary{cursor:pointer;font-weight:700}
details.set summary{font-size:15px}
details.set[open] summary{margin-bottom:12px}
details.sub{margin-top:10px}
details.sub[open] summary{margin-bottom:8px}
textarea.memo{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--input)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat span{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-size:19px}
table.dash,table.maptbl{border-collapse:collapse;width:100%;font-size:13.5px}
table.dash th,table.dash td,table.maptbl th,table.maptbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.maptbl th,table.maptbl td{padding:4px 8px;font-size:12.5px}
table.dash th,table.maptbl th{color:var(--muted);font-weight:600;font-size:12.5px}
table.dash td.n{text-align:right;font-variant-numeric:tabular-nums}
table.dash.click tbody tr{cursor:pointer}
table.dash.click tbody tr:hover{background:var(--soft)}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-bottom:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
ul.plain{margin:0;padding-left:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
#print{display:none}
@media (max-width:900px){.layout{display:block}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.navgroup{display:none}.navitem{width:auto;white-space:nowrap}main{padding:16px}.grid2,.paste{grid-template-columns:1fr}.top{position:static}}
@media print{
  html,body{background:#fff!important;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .basic{font-size:10pt}
  #print .basic h1{font-size:16pt;margin:0 0 4mm}
  #print .basic table{border-collapse:collapse;width:100%;margin-bottom:5mm}
  #print .basic th,#print .basic td{border:1px solid #999;padding:1.2mm 2mm;text-align:right;font-size:9pt}
  #print .basic th{background:#e8eef3}
  #print .basic td:first-child,#print .basic th:first-child{text-align:left}
  #print .basic tr{break-inside:avoid}
  #print .basic .foot{color:#555;font-size:8.5pt;margin-top:4mm}
  #print table.xl{border-collapse:collapse;table-layout:fixed;font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#000}
  #print table.xl td{padding:0 3px;white-space:nowrap;overflow:hidden;line-height:1.15}
  #print table.xl td.tx{overflow:visible}
  #print table.xl tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1>월 정산 워크벤치</h1>
  <label class="m">정산월 <input type="month" id="month"></label>
  <div class="chips" id="monthInfo"></div>
  <div class="grow"></div>
  <button class="btn ghost sm" id="btnBackup" title="입력 데이터와 설정을 JSON 파일로 저장">백업</button>
  <label class="btn ghost sm" title="백업 JSON 파일 불러오기">복원<input type="file" id="restore" accept=".json" hidden></label>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="print"></div>
<div id="toast"></div>

<script src="settle-sync.js"></script>
<script>

const NODAYS = { 28: '', 29: '', 30: '', 31: '' };
const TARGETS = [

}
async function tplGet(id) {
  if (tplMem[id]) return tplMem[id];

    const meta = (store.get('stl.tplmeta', {}) || {})[id];
    if (meta) {
      const f = await STL_SYNC.fileGet('tpl/' + id + '.xlsx');
      if (f && f.buf && f.buf.byteLength) {
        tplWhere[id] = 'server';
        return (tplMem[id] = { name: meta.name, savedAt: meta.savedAt, source: meta.source, buf: f.buf });
      }
    }
  } catch (e) { console.warn('양식 서버 조회 실패', e); }
  try { const v = await idbGet(await idb(), id); if (v && v.buf) { tplWhere[id] = 'idb'; return (tplMem[id] = v); } } catch (e) {}
  try { const raw = localStorage.getItem('stl.tpl.' + id); if (raw) { const o = JSON.parse(raw); tplWhere[id] = 'ls'; return (tplMem[id] = { name: o.name, savedAt: o.savedAt, source: o.source, buf: b642ab(o.b64) }); } } catch (e) {}

const $ = s => document.querySelector(s);

const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}년 ${+m}월`; };
const shiftYm = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const yymmdd = () => { const d = new Date(); return pad(d.getFullYear() % 100) + pad(d.getMonth() + 1) + pad(d.getDate()); };
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

function unitPrice(s, D) { return s.priceMode === 'fixed' ? num(s.fixed) : num(s.days[D]); }

/* ═════════ 계산·검증 ═════════ */
function compute(t, ym, td) {
  const s = getS(t.id), D = daysIn(ym);
  const R = { D, s, amount: null, amountLabel: '정산액', lines: [], rows: [], errors: [], warnings: [], filled: 0, sums: {} };
  const rows = td.rows || {}, ex = td.extra || {}, F = FIELDS[t.type], key = KEYF[t.type] || 'N';
  const get = (d, k) => num(rows[d]?.[k]);
  const list = a => { const u = [...new Set(a)]; return u.slice(0, 8).join(', ') + (u.length > 8 ? ` 외 ${u.length - 8}` : ''); };

  let price = null, cpa = null, rsp = null;
  if (t.type === 'rs') {
    price = unitPrice(s, D);
    if (price == null) R.errors.push(`${D}일 달의 단가가 등록되지 않았습니다. 아래 ‘단가·기준 설정’에서 입력하세요. (추정 계산하지 않음)`);
    else if (Number.isNaN(price)) { R.errors.push('단가 형식이 올바르지 않습니다.'); price = null; }
  }
  if (t.type === 'ending') { cpa = num(s.cpa); rsp = num(s.rs); if (!ok(cpa) || !ok(rsp)) { R.errors.push('CPA 또는 RS 단가가 없습니다.'); cpa = rsp = null; } }
  if (t.type === 'cloud') { const m = num(s.monthly); price = ok(m) ? r2(m / D) : null; if (price == null) R.errors.push('월 기준 금액이 없습니다.'); }

  const sums = Object.fromEntries(F.map(k => [k, 0]));
  const missing = [], bad = [], chain = [], sMiss = [], sBad = [], cpaNeg = [], zeroIn = [];
  let sumAmt = 0, sumCpa = 0, sumRs = 0;
  for (let d = 1; d <= D; d++) {
    const row = { d, amt: null, price: null };
    F.forEach(k => { row[k] = get(d, k); if (row[k] != null && (Number.isNaN(row[k]) || row[k] < 0)) bad.push(d); else if (ok(row[k])) sums[k] += row[k]; });
    const { J, C, N, S } = row;
    if (!ok(row[key])) missing.push(d); else R.filled++;
    if (d > 1 && F.includes('J')) { const P = get(d - 1, 'N'); if (ok(P) && ok(N) && ok(J) && ok(C) && r2(P + J - C) !== N) chain.push(d); }
    if (ok(J) && ok(C)) row.net = J - C;
    if ((t.type === 'rs' || t.type === 'cloud') && ok(N) && price != null) { row.price = price; row.amt = r2(N * price); sumAmt += row.amt; }
    if (t.type === 'ending') {
      if (ok(J) && !ok(S)) sMiss.push(d);
      if (ok(S) && ((ok(J) && S > J) || (ok(C) && S > C))) sBad.push(d);
      if (ok(C) && ok(S)) row.late = C - S;
      if (cpa != null) {
        row.cpa = ok(J) && ok(S) ? (J - S) * cpa : null;
        row.rs = ok(N) ? r2(N * rsp) : null;
        if (row.cpa != null) { sumCpa += row.cpa; if (row.cpa < 0) cpaNeg.push(d); }
        if (row.rs != null) sumRs += row.rs;
        if (row.cpa != null || row.rs != null) row.amt = r2((row.cpa || 0) + (row.rs || 0));
      }
    }
    if (t.type === 'diet') { row.rate = ok(row.inflow) && row.inflow > 0 && ok(row.done) ? row.done / row.inflow : null; if (row.inflow === 0 && row.done > 0) zeroIn.push(d); }
    R.rows.push(row);

  if (bad.length) R.errors.push(`숫자가 아니거나 음수인 값이 있습니다: ${list(bad)}일`);
  if (t.type !== 'finq' && missing.length) R.errors.push(`${D}일 중 ${missing.length}일의 ${label(t, key)}이 비어 있습니다: ${list(missing)}일`);
  if (chain.length) R.warnings.push(`전일 누적 + 가입 − 해지 ≠ 당일 누적: ${list(chain)}일 (보정값이면 무시 가능, 자동 수정하지 않음)`);

  if (t.type === 'rs') {

      [`적용 단가 (${D}일 달${s.priceMode === 'fixed' ? ', 고정' : ''})`, price == null ? '미등록' : won(price)]);
  }
  if (t.type === 'ending') {
    if (sMiss.length) R.errors.push(`가입수는 있는데 당일해지가 빈 날: ${list(sMiss)}일 — CPA 계산 보류`);
    if (sBad.length) R.warnings.push(`당일해지가 가입수 또는 해지수보다 큰 날: ${list(sBad)}일`);
    if (cpaNeg.length) R.warnings.push(`CPA가 음수인 날: ${list(cpaNeg)}일 (0으로 보정하지 않음)`);
    if (!R.errors.length) R.amount = r2(sumCpa + sumRs);
    R.lines.push([`CPA 대상 (가입 ${fmt(sums.J)} − 당일해지 ${fmt(sums.S)})`, fmt(sums.J - sums.S) + '건'], [`CPA 소계 (× ${fmt(cpa)})`, won(sumCpa)],
      [`RS 이용자-일 ${fmt(sums.N)} × ${fmt(rsp)}`, won(r2(sumRs))], ['지연해지 (해지 − 당일해지)', fmt(sums.C - sums.S) + '건']);
  }
  if (t.type === 'cloud') {
    const cd = num(ex.ctnDays), ca = num(ex.ctnAmt);
    if (!R.errors.length) R.amount = r2(sumAmt);
    R.lines.push(['유료 이용일수 합계', fmt(sums.N) + '일'], [`일 단가 ROUND(${fmt(num(s.monthly))} ÷ ${D}, 2)`, won(price)]);
    if (cd == null && ca == null) R.warnings.push('CTN 대조값(이용일수·금액)을 입력하지 않았습니다.');
    if (cd != null) { R.lines.push(['CTN 이용일수', fmt(cd) + '일']); if (cd !== sums.N) R.errors.push(`CTN 이용일수 ${fmt(cd)}일 ≠ 일별 합계 ${fmt(sums.N)}일 (차이 ${fmt(sums.N - cd)}일)`); }
    if (ca != null) { R.lines.push(['CTN 금액 합계', won(ca)]); if (Math.abs(ca - r2(sumAmt)) >= 0.01) R.errors.push(`CTN 금액 ${won(ca)} ≠ 계산 금액 ${won(r2(sumAmt))} (차이 ${won(r2(sumAmt - ca))})`); }
    if (cd != null && ca != null && !R.errors.length) R.ok = 'CTN 이용일수·단가·금액 대조 일치';
    const cs = ex.cloudSrc;
    if (cs) {
      const dc = Object.keys(cs.daily || {}), cc = Object.keys(cs.ctn || {});
      const badP = dc.filter(c => (cs.daily[c].prices || []).some(p => price != null && Math.abs(p - price) > 1e-9));
      if (badP.length) R.warnings.push(`일자별 파일의 일단가가 ROUND(500÷${D},2)=${price}원과 다릅니다: ${badP.join(', ')}`);
      const dup = dc.filter(c => cs.daily[c].dup); if (dup.length) R.warnings.push(`일자별 파일에 같은 날짜가 두 번 있습니다(나중 값 사용): ${dup.join(', ')}`);
      const onlyD = dc.filter(c => !cc.includes(c)), onlyC = cc.filter(c => !dc.includes(c));
      if (onlyD.length) R.warnings.push(`CTN 파일이 없는 통신사: ${onlyD.join(', ')}`);
      if (onlyC.length) R.warnings.push(`일자별 파일이 없는 통신사: ${onlyC.join(', ')}`);
      if (dc.length > 1) R.lines.push(['통신사별 합산', dc.join(' + ')]);

    const unit = num(s.unit), th = num(s.threshold), last = get(D, 'N');

    const accrual = ok(last) && unit != null ? last * unit : null;
    const carry = num(ex.carry), paid = num(ex.paid) || 0;
    if (carry == null) R.warnings.push('전월 이월액이 비어 있습니다. 0원이 맞는지 확인하세요.');
    const bal = (carry || 0) + (accrual || 0), payable = th != null && bal >= th;
    R.amountLabel = '당월 발생액';
    if (!R.errors.length) R.amount = accrual;
    Object.assign(R.sums, { last, unit, accrual, carry, paid, bal, after: bal - paid, th, payable });
    R.lines.push([`말일 가입누적 × ${fmt(unit)}원`, `${fmt(last)} × ${fmt(unit)}`], ['전월 이월액', carry == null ? '미입력' : won(carry)],
      ['누적 잔액 (이월 + 발생)', won(bal)], [`지급 기준 ${won(th)}`, payable ? '지급 대상' : '지급 대기 (이월)'],
      ['당월 지급 처리액', won(paid)], ['익월 이월 잔액', won(bal - paid)]);

  if (t.type === 'diet') {

    if (zeroIn.length) R.warnings.push(`상담 인입이 0건인데 완료가 있는 날: ${list(zeroIn)}일`);

    Object.assign(R.sums, { base, t35, t6, inc35, inc6, supply, vat });
    R.lines.push(['기본급', won(base)], [`3~5회차 ${fmt(sums.a35)}회 × ${fmt(t35)}`, won(inc35)], [`6회 이상 ${fmt(sums.a6)}회 × ${fmt(t6)}`, won(inc6)],
      ['지급액 (공급가)', won(supply)], ['부가세', s.vat ? won(vat) : '해당 없음'], ['1~2회차 합계 (인센티브 제외)', fmt(sums.a12) + '회'],

  };
  const maxC = Math.max(src.columnCount, ...info.cols.map(c => c.c));
  for (let c = 1; c <= maxC; c++) { const sc = src.getColumn(c), tc = ns.getColumn(c); if (sc.width) tc.width = sc.width; if (sc.hidden) tc.hidden = true; }
  const lastR = src.rowCount + delta;
  for (let tr = 1; tr <= lastR; tr++) {
    const sr = srcRowFor(tr), inData = tr >= F && tr <= Ln, srow = src.getRow(sr), trow = ns.getRow(tr);
    if (srow.height) trow.height = srow.height; if (srow.hidden) trow.hidden = true;
    const d = tr - F + 1, rv = inData ? R.rows[d - 1] : null;
    for (let c = 1; c <= maxC; c++) {
      const sc = src.getCell(sr, c), tc = ns.getCell(tr, c);
      if (sc.style && Object.keys(sc.style).length) tc.style = clone(sc.style);
      if (sc.isMerged && sc.master && sc.master.address !== sc.address) continue;
      const f = fOf(src, sc), sem = inData ? semOf[c] : null;
      if (inData && sem) {
        if (sem === 'date') {
          if (f && d > 1) { tc.value = { formula: tr8(f, sr, tr, true) }; continue; }
          const di = dateOf(sc.value) || info.dateInfo;
          tc.value = di.kind === 'text' ? `${Yn}${di.sep}${di.pad ? pad(Mn) : Mn}${di.sep}${di.pad ? pad(d) : d}` : new Date(Date.UTC(Yn, Mn - 1, d));
          continue;
        }
        if (INPUT_SEM.has(sem)) { const x = rv[sem]; tc.value = ok(x) ? x : null; continue; }
        if (f) { tc.value = { formula: tr8(f, sr, tr, true) }; continue; }
        const x = { net: rv.net, late: rv.late, rate: rv.rate, amt: rv.amt, cpa: rv.cpa, rs: rv.rs }[sem];
        tc.value = ok(x) ? x : null; continue;
      }
      if (f) { tc.value = { formula: dayFix(tr8(f, sr, tr, inData)) }; continue; }
      tc.value = inData ? null : swapVal(sc.value);
    }
  }
  extended.forEach(col => notes.push(`${col}열 합계 수식이 말일 행을 빠뜨리고 있어 ${F}~${Ln}행 전체로 넓혔습니다.`));
  if (dayFixed.size) notes.push(`수식 안의 월 일수 ${Dtm}을(를) ${Dn}(으)로 바꿨습니다 (예: ROUND(500/${Dn},2)).`);
  staleRefs.forEach(x => { const [a, b] = x.split('→'); notes.push(`⚠ ‘${a}’ 시트를 참조하는 수식이 있는데 ‘${b}’ 시트가 파일에 없어 그대로 두었습니다. 해당 시트를 추가한 뒤 수식을 확인하세요.`); });
  // 셀 병합 (병합 후 원래 테두리 복원)
  (src.model.merges || []).forEach(rg => {
    const m = rg.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/); if (!m) return;
    const ca = colN(m[1]), cb = colN(m[3]), ra = mapRow(+m[2]), rb = mapRow(+m[4]);
    if (ra > rb || (ra === rb && ca === cb)) return;
    try { ns.mergeCells(ra, ca, rb, cb); } catch (e) { return; }
    for (let r = ra; r <= rb; r++) for (let c = ca; c <= cb; c++) { const st = src.getCell(srcRowFor(r), c).style; if (st && Object.keys(st).length) ns.getCell(r, c).style = clone(st); }
  });
  // 단가 셀 교체: 원본 수식이 가리키는 단가가 이번 달 단가와 다르면, 시트 안의 같은 단가 셀(예: 단가표)로 바꾸거나 숫자로 넣는다
  // (일별 금액 수식 속 단가가 숫자로 적혀 있든 $단가 셀을 가리키든, 이번 달 단가와 다르면 맞춘다)
  const want = t.type === 'ending' ? { cpa: num(R.s.cpa), rs: num(R.s.rs) } : (t.type === 'rs' || t.type === 'cloud') ? { amt: R.sums.price } : {};
  const NUM_RE = /(?<![A-Za-z0-9_.$:])(\d+(?:\.\d+)?)(?![\d.A-Za-z(!:])/g;
  const outsideStr = (f, fn) => f.split(/("(?:[^"]|"")*")/).map((p, i) => i % 2 ? p : fn(p)).join('');
  info.cols.forEach(({ c }) => {
    const sem = semOf[c]; if (!(sem in want)) return;
    const w = want[sem], fv = ns.getCell(F, c).value; if (!fv || typeof fv.formula !== 'string') return;
    let refFrom = null, refCur = null; const lits = [];
    mapRefs(fv.formula, (sh, a, b) => { if (!sh && !b && a.rowAbs && a.colAbs && (a.row < F || a.row > Ln)) { const v = ns.getCell(a.row, colN(a.col)).value; if (typeof v === 'number') { refFrom = a; refCur = v; } } return null; });
    outsideStr(fv.formula, p => p.replace(NUM_RE, m => { lits.push(+m); return m; }));
    const cur = refFrom ? refCur : lits.length === 1 ? lits[0] : null;
    if (!ok(w)) { if (cur != null) notes.push(`⚠ ${Dn}일 달 단가가 워크벤치에 등록되지 않아 양식의 기존 단가 ${cur}원이 그대로 들어갔습니다. 단가를 확인하세요.`); return; }
    if (cur == null || Math.abs(cur - w) < 1e-9) return;
    let desc = `${w}원으로`;
    if (refFrom) {
      let found = null;
      for (let r = 1; r <= lastR && !found; r++) { if (r >= F && r <= Ln) continue; for (let cc = 1; cc <= maxC; cc++) { const v = ns.getCell(r, cc).value; if (typeof v === 'number' && Math.abs(v - w) < 1e-9) { found = { col: colL(cc), row: r }; break; } } }
      const key = `$${refFrom.col}$${refFrom.row}`;
      for (let r = F; r <= Ln; r++) {
        const cell = ns.getCell(r, c), v = cell.value; if (!v || typeof v.formula !== 'string') continue;
        cell.value = { formula: found ? mapRefs(v.formula, (sh, a, b) => !sh && !b && a.rowAbs && a.colAbs && a.col === refFrom.col && a.row === refFrom.row ? { a: { ...a, col: found.col, row: found.row } } : null) : v.formula.split(key).join(String(w)) };
      }
      if (found) desc = `${found.col}${found.row} 셀(${w}원)을 참조하도록`;
    } else {

  if (t.type === 'cloud') {

  const ps = clone(src.pageSetup) || {};

  }));

    else notes.push(`✓ 엑셀 양식 계산 결과가 워크벤치 금액 ${won(R.amount)}과 일치합니다.`);

  if (cs) cs.eachRow({ includeEmpty: false }, row => row.eachCell({ includeEmpty: false }, cell => {

  }));
  const others = wb.worksheets.filter(w => w !== ns && !infos.some(i => i.ws === w) && !/ctn/i.test(w.name) && !(sumDone && /요약/.test(w.name)));
  if (others.length) notes.push(`요약용 시트(${others.map(w => w.name).join(', ')})는 자동으로 고치지 않았습니다. 필요하면 엑셀에서 새 달 금액을 연결하세요.`);
  let fileName = swapMonth(rec.name, Yt, Mt, Yn, Mn);
  fileName = fileName.replace(/_\d{6}(?=[^\\/_]*\.xlsx$)/i, '_' + yymmdd());
  if (!/\.xlsx$/i.test(fileName)) fileName += '.xlsx';

/* 기준 CTN 시트(sw)의 머리글·서식·합계행을 그대로 두고 데이터 행만 원천 CTN 목록으로 바꿔 cs에 만든다 */
function buildCtnSheet(sw, cs, rows, Yt, Mt, Yn, Mn, Dtm, Dn) {
  const maxC = sw.columnCount;
  let H = 0;
  for (let r = 1; r <= Math.min(sw.rowCount, 15) && !H; r++) for (let c = 1; c <= maxC; c++) if (ID_RE.test(cellText(sw.getCell(r, c)).trim())) { H = r; break; }
  if (!H) throw new Error(`‘${sw.name}’ 시트에서 고유식별키(CTN) 머리글을 찾지 못했습니다.`);
  const F0 = H + 1, lastR = sw.rowCount;
  const hasTot = Array.from({ length: maxC }, (_, i) => cellText(sw.getCell(lastR, i + 1)).replace(/\s/g, '')).includes('합계');
  const L0 = hasTot ? lastR - 1 : lastR, n = rows.length, L1 = F0 + n - 1, shift = L1 - L0;
  const mapRow = r => r < F0 ? r : r <= L0 ? (r === L0 ? L1 : Math.min(r, L1)) : r + shift;
  const KEY = [/정산월/, /통신사/, ID_RE, /패스키|PASSKEY/i, /유료일수/, /정산금액|금액/];
  const keyOf = {}; for (let c = 1; c <= maxC; c++) { const h = cellText(sw.getCell(H, c)).replace(/\s/g, ''); const k = KEY.findIndex(re => re.test(h)); if (k >= 0) keyOf[c] = k; }
  const fix = f => mapRefs(f, (sh, a, b) => sh ? null : ({ a: { ...a, row: mapRow(a.row) }, b: b && { ...b, row: mapRow(b.row) } }))
    .replace(new RegExp(`(ROUND\\(\\s*\\d+(?:\\.\\d+)?\\s*/\\s*)${Dtm}(?=\\s*,)`, 'g'), `$1${Dn}`);
  const swapV = v => typeof v === 'string' ? swapMonth(v, Yt, Mt, Yn, Mn) : v && v.richText ? { richText: v.richText.map(x => ({ ...x, text: swapMonth(x.text, Yt, Mt, Yn, Mn) })) } : v;
  for (let c = 1; c <= maxC; c++) { const sc = sw.getColumn(c); if (sc.width) cs.getColumn(c).width = sc.width; if (sc.hidden) cs.getColumn(c).hidden = true; }
  const copyRow = (sr, tr) => {
    const h = sw.getRow(sr).height; if (h) cs.getRow(tr).height = h;
    for (let c = 1; c <= maxC; c++) {
      const sc = sw.getCell(sr, c), tc = cs.getCell(tr, c);
      if (sc.style && Object.keys(sc.style).length) tc.style = clone(sc.style);
      if (sc.isMerged && sc.master && sc.master.address !== sc.address) continue;
      const f = fOf(sw, sc); tc.value = f ? { formula: fix(f) } : swapV(sc.value);
    }
  };
  for (let r = 1; r < F0; r++) copyRow(r, r);
  for (let c = 1; c <= maxC; c++) if (ID_RE.test(cellText(cs.getCell(H, c)).trim())) cs.getCell(H, c).value = ID_LABEL;
  const colStyle = {}, colF = {};
  for (let c = 1; c <= maxC; c++) { const sc = sw.getCell(F0, c); colStyle[c] = sc.style && Object.keys(sc.style).length ? clone(sc.style) : null; colF[c] = fOf(sw, sc); }
  const h0 = sw.getRow(F0).height;
  rows.forEach((rv, i) => {
    const tr = F0 + i; if (h0) cs.getRow(tr).height = h0;
    for (let c = 1; c <= maxC; c++) {
      const tc = cs.getCell(tr, c); if (colStyle[c]) tc.style = colStyle[c];
      if (colF[c]) tc.value = { formula: slide(colF[c], i, 0) };
      else if (keyOf[c] != null) { const v = rv[keyOf[c]]; tc.value = v == null || v === '' ? null : v; }
    }
  });
  for (let r = L0 + 1; r <= lastR; r++) copyRow(r, r + shift);
  (sw.model.merges || []).forEach(rg => {
    const m = rg.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/); if (!m || (+m[2] >= F0 && +m[4] <= L0)) return;
    try { cs.mergeCells(mapRow(+m[2]), colN(m[1]), mapRow(+m[4]), colN(m[3])); } catch (e) {}
  });
  cs.pageSetup = clone(sw.pageSetup) || {}; if (cs.pageSetup.printArea) delete cs.pageSetup.printArea;
  cs.views = (clone(sw.views) || [{}]).map(v => ({ ...v, tabSelected: false }));
}

/* 안심클라우드 「요약」 시트 — ‘월별 정산 총괄’ 표마다 새 정산월 행을 마지막 정산월 바로 아래(누적 합계 위)에 넣는다.
   기준 달 행을 복사해서, 달 시트 참조(26.08 → 26.09 · 26.08_ctn → 26.09_ctn, 끝 행은 새 시트 끝으로)와
   "2026-08" 같은 조건 문자열을 새 달로 바꾸고, 이 시트 안 참조는 한 행 아래로 옮긴다(일치 여부 · 전월 대비 수식이 짝 행을 따라간다).
   누적 합계 행은 새 행까지 넓힌다. 행이 밀리므로 이 시트의 수식 · 병합 · 조건부 서식 · 입력 목록 범위도 함께 옮긴다.
   분기 정산 진행 현황 같은 다른 표의 글자(반영 월 등)는 사람이 판단할 내용이라 그대로 둔다. */
function addSummaryMonth(wb, Yt, Mt, Yn, Mn, notes) {
  const ws = wb.worksheets.find(w => /요약/.test(w.name)); if (!ws) return false;
  const maxC = Math.max(ws.columnCount, 8), lastR = ws.rowCount, ymT = `${Yt}-${pad(Mt)}`, ymN = `${Yn}-${pad(Mn)}`;
  const ymOf = v => {
    if (v && typeof v === 'object' && 'result' in v) v = v.result;
    if (typeof v === 'number' && v > 2000 && v < 2100) { const y = Math.floor(v), m = Math.round((v - y) * 100); return m >= 1 && m <= 12 ? `${y}-${pad(m)}` : null; }
    if (typeof v === 'string') { const m = v.trim().match(/^(\d{4})\s*[.\-/]\s*(\d{1,2})$/); return m ? `${m[1]}-${pad(+m[2])}` : null; }
    return null;
  };
  const tables = [];
  for (let r = 1; r <= lastR; r++) {
    if (![...Array(maxC).keys()].some(i => /월별\s*정산\s*총괄/.test(cellText(ws.getCell(r, i + 1))))) continue;
    let mc = 0, hr = 0;
    for (let rr = r + 1; rr <= r + 3 && !mc; rr++) for (let c = 1; c <= maxC; c++) if (cellText(ws.getCell(rr, c)).replace(/\s/g, '') === '정산월') { mc = c; hr = rr; break; }
    if (!mc) continue;
    const months = []; let total = 0;
    for (let rr = hr + 1; rr <= lastR; rr++) {
      const ym = ymOf(ws.getCell(rr, mc).value);
      if (ym) { months.push({ r: rr, ym }); continue; }
      if (/누적|합계/.test(cellText(ws.getCell(rr, mc)))) { total = rr; break; }
      if (months.length) break;
    }
    if (!months.length) continue;
    tables.push({ title: cellText(ws.getCell(r, mc)) || `${r}행 표`, mc, months, total, base: months.find(m => m.ym === ymT), has: months.some(m => m.ym === ymN), last: months[months.length - 1] });
  }
  const todo = tables.filter(t => t.base && !t.has);
  // 일 단가 표(해당 월 일수 28·29·30·31일 열 + 바로 아래 단가 행): 새 행은 새 달 일수 열을 가리킨다
  const dayCol = {}; let dayRow = 0;
  for (let r = 1; r <= Math.min(lastR, 20) && !dayRow; r++) for (let c = 1; c <= maxC; c++) { const m = cellText(ws.getCell(r, c)).replace(/\s/g, '').match(/^(28|29|30|31)일$/); if (m) { dayCol[+m[1]] = c; dayRow = r; } }
  const Dt = daysIn(ymT), Dn = daysIn(ymN);
  if (!todo.length) { if (tables.some(t => t.has)) notes.push(`요약 시트 ‘월별 정산 총괄’에는 이미 ${ymN.replace('-', '.')} 행이 있어 그대로 두었습니다.`); return tables.length > 0 && tables.every(t => t.has); }
  const ins = todo.map(t => t.last.r + 1).sort((a, b) => a - b), first = ins[0];
  const nr = r => r + ins.filter(x => x <= r).length;
  const self = sh => sh == null || sh === ws.name;
  const remap = f => mapRefs(f, (sh, a, b) => self(sh) ? { a: { ...a, row: nr(a.row) }, b: b && { ...b, row: nr(b.row) } } : null);
  // 1) 병합 풀기 → 행 옮기기(아래부터) → 병합 다시
  const merges = (ws.model.merges || []).slice();
  const moved = merges.filter(rg => { const m = rg.match(/[A-Z]+(\d+):[A-Z]+(\d+)/); return m && +m[2] >= first; });
  moved.forEach(rg => { try { ws.unMergeCells(rg); } catch (e) {} });
  const copyCell = (from, to) => {
    const f = fOf(ws, from);
    to.style = from.style && Object.keys(from.style).length ? clone(from.style) : {};
    to.value = f ? { formula: remap(f) } : (from.value && typeof from.value === 'object' && !(from.value instanceof Date) && 'result' in from.value ? from.value.result : from.value);
  };
  for (let r = lastR; r >= first; r--) {
    const tr = nr(r), srow = ws.getRow(r), trow = ws.getRow(tr);
    trow.height = srow.height; trow.hidden = srow.hidden;
    for (let c = 1; c <= maxC; c++) copyCell(ws.getCell(r, c), ws.getCell(tr, c));
  }
  for (let r = 1; r < first; r++) for (let c = 1; c <= maxC; c++) { const cell = ws.getCell(r, c), f = fOf(ws, cell); if (f) cell.value = { formula: remap(f) }; }
  ins.forEach((x, i) => { const r = x + i; const row = ws.getRow(r); for (let c = 1; c <= maxC; c++) { const cell = ws.getCell(r, c); cell.value = null; cell.style = {}; } row.height = undefined; });
  moved.forEach(rg => { const m = rg.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/); try { ws.mergeCells(nr(+m[2]), colN(m[1]), nr(+m[4]), colN(m[3])); } catch (e) {} });
  // 조건부 서식 · 입력 목록 범위
  (ws.conditionalFormattings || []).forEach(cf => {
    cf.ref = String(cf.ref).split(/\s+/).map(x => mapRefs(x, (sh, a, b) => ({ a: { ...a, row: nr(a.row) }, b: b && { ...b, row: nr(b.row) } }))).join(' ');
    (cf.rules || []).forEach(rule => { if (Array.isArray(rule.formulae)) rule.formulae = rule.formulae.map(remap); });
  });
  if (ws.dataValidations && ws.dataValidations.model) {
    const dv = {}; Object.entries(ws.dataValidations.model).forEach(([k, v]) => { dv[mapRefs(k, (sh, a, b) => ({ a: { ...a, row: nr(a.row) }, b: b && { ...b, row: nr(b.row) } }))] = v; });
    ws.dataValidations.model = dv;
  }
  // 2) 새 정산월 행 채우기
  const missing = new Set();
  const other = (sh, a, b) => {
    const sw = swapMonth(sh, Yt, Mt, Yn, Mn); if (sw === sh) return null;
    const to = wb.getWorksheet(sw), from = wb.getWorksheet(sh);
    if (!to) { missing.add(sw); return null; }
    const end = x => { if (!from) return x; const fl = lastValRow(from, colN(x.col)), tl = lastValRow(to, colN(x.col)); return x.row >= fl - 1 ? { ...x, row: Math.max(tl - (fl - x.row), 1) } : x; };
    return b ? { a, b: end(b), sheet: sw } : { a: end(a), sheet: sw };
  };
  const strMonth = f => f.replace(/"((?:[^"]|"")*)"/g, (m, x) => `"${swapMonth(x, Yt, Mt, Yn, Mn)}"`);
  const blocks = todo.map(t => [nr(t.months[0].r), nr(t.last.r)]);
  todo.forEach(t => {
    const base = nr(t.base.r), lastNew = nr(t.last.r), row = lastNew + 1, d = row - base, firstNew = nr(t.months[0].r), tot = t.total ? nr(t.total) : 0;
    const brow = ws.getRow(base); ws.getRow(row).height = brow.height;
    for (let c = 1; c <= maxC; c++) {
      const bc = ws.getCell(base, c), tc = ws.getCell(row, c);
      if (bc.style && Object.keys(bc.style).length) tc.style = clone(bc.style);
      if (c === t.mc) {
        const v = bc.value;
        if (typeof v === 'number') { tc.value = +(Yn + Mn / 100).toFixed(2); tc.numFmt = '0.00'; }
        else tc.value = typeof v === 'string' ? swapMonth(v, Yt, Mt, Yn, Mn) : `${Yn}.${pad(Mn)}`;
        continue;
      }
      const f = fOf(ws, bc);
      if (f) tc.value = { formula: strMonth(mapRefs(f, (sh, a, b) => {
        if (!self(sh)) return other(sh, a, b);
        // 정산월 행끼리의 참조(전월 대비 · 일치 여부 짝)만 한 행 내리고, 단가 표처럼 표 밖 칸은 그대로 — 단가는 새 달 일수 열로
        const mv = x => x && ({ ...x, row: !x.rowAbs && blocks.some(([lo, hi]) => x.row >= lo && x.row <= hi) ? x.row + d : x.row,
          col: dayRow && x.row > dayRow && x.row <= dayRow + 2 && colN(x.col) === dayCol[Dt] && dayCol[Dn] ? colL(dayCol[Dn]) : x.col });
        return { a: mv(a), b: mv(b) };
      })) };
      else tc.value = bc.value && typeof bc.value === 'object' && 'result' in bc.value ? bc.value.result : bc.value;
    }
    if (tot) for (let c = 1; c <= maxC; c++) {
      const cell = ws.getCell(tot, c), f = fOf(ws, cell); if (!f) continue;
      cell.value = { formula: mapRefs(f, (sh, a, b) => {
        if (!self(sh)) return null;
        if (b) return b.row === lastNew ? { a, b: { ...b, row } } : null;
        return a.row >= firstNew && a.row <= lastNew ? { a: { ...a, row: a.row + 1 } } : null;
      }) };
    }
  });
  notes.push(`요약 시트 ${todo.map(t => `‘${t.title}’`).join(' · ')}에 ${ymN.replace('-', '.')} 행을 추가하고 누적 합계를 넓혔습니다. 분기 정산 진행 현황의 글자(반영 월 등)는 확인해서 고쳐 주세요.`);
  missing.forEach(x => notes.push(`⚠ 요약 시트 새 행이 참조할 ‘${x}’ 시트가 없어 해당 수식은 기준 달 시트를 그대로 가리킵니다. 원천 파일을 불러온 뒤 다시 출력하세요.`));
  return true;
}

function confirmErrors(t) {

}
async function tplExport(t, silent) {
  const rec = await tplGet(t.id); if (!rec) throw new Error(`${t.name}: 기존 양식 파일이 등록되지 않았습니다.`);
  if (!silent && !confirmErrors(t)) return;
  const g = await buildFromTemplate(t, state.ym, tdata(t.id), rec);
  const out = await g.wb.xlsx.writeBuffer();
  const buf = out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength);
  download(g.fileName, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  await tplPut(t.id, { name: g.fileName, buf, savedAt: Date.now(), source: 'generated' });
  state.notes[t.id] = g.notes;
  return g;
}
async function tplPdf(t) {

}
/* 기존 양식 등록 (파일 1개 → 대상 1개) */
async function registerTpl(t, file, quiet) {
  const buf = await file.arrayBuffer(), rec = { name: file.name, buf, savedAt: Date.now(), source: 'upload' };
  const infos = analyzeBook(await loadBook(rec));
  if (isCloudSourceName(file.name) || infos.some(i => i.cols.some(c => /통신사/.test(c.label)))) {
    if (!quiet) alert(`${file.name}\n이 파일은 정산 양식이 아니라 안심클라우드 원천 데이터(일자별 가입자·CTN)입니다.\n안심클라우드 화면의 ‘원천 파일’ → ‘원천 엑셀 불러오기’에 넣어 주세요.\n기존 양식에는 02_정산\\안심클라우드의 지난달 정산 파일(예: ${T.CL01.file})을 등록합니다.`);
    return null;
  }
  if (!infos.length) { if (!quiet) alert(`${file.name}\n이 파일에서 ‘날짜’·‘일자’·‘정산일’ 머리글이 있는 일별 표를 찾지 못했습니다.`); return null; }
  const where = await tplPut(t.id, rec); delete state.notes[t.id];
  const sv = settings[t.id] || {}; delete sv.tplSheet; sv.tplMap = {}; settings[t.id] = sv; store.set('stl.settings.v1', settings);
  if (!quiet) toast(`양식 등록: ${file.name}${where === 'mem' ? ' (⚠ 브라우저 저장 실패 — 이 창에서만 유지)' : ''}`);
  return { infos, where };
}
/* 양식이 없으면 기본 양식으로 넘어가지 않고 파일 선택 → 등록 → 이어서 출력 */
function pickTplThen(t, then) {

const MATCH = { HC01: /배너/, HC02: /엔딩/, HC03: /핀크/, HC04: /제이엠/, HC05: /드리미/, HC06: /인센티브|식단/, MC01: /JSF\s*\(?\s*13\b/i, MC02: /JSF\s*\(?\s*45\b/i, CL01: /안심클라우드/ };
const isCloudSourceName = n => /웹하드\s*정산\s*(사용자\s*)?목록/.test(n);
async function registerBulk(files) {

  [...files].sort((a, b) => a.name < b.name ? -1 : 1).forEach(f => { if (isCloudSourceName(f.name)) return cloudSrc.push(f); const id = Object.keys(MATCH).find(k => MATCH[k].test(f.name)); if (id) byT[id] = f; else skipped.push(f.name); });
  if (cloudSrc.length) await importCloudFiles(T.CL01, cloudSrc);

  }
  const missing = TARGETS.filter(x => !byT[x.id]).map(x => x.name);

  renderMain();
}
async function busy(btn, fn) {

  if (act === 'xlsxBasic') exportBasic(t);
  if (act === 'pdfBasic') printBasic(t);
  if (act === 'tplRemove' && confirm('이 대상의 기존 양식 파일 연결을 해제할까요? (원본 파일은 그대로입니다)')) { tplDel(t.id).then(() => { delete state.notes[t.id]; setS(t.id, { tplSheet: undefined, tplMap: {} }); renderTplCard(t); }); }
  if (act === 'paste') {
    const txt = $('#pasteBox').value; if (!txt.trim()) return toast('붙여넣을 내용이 없습니다.');
    const p = parsePaste(txt, getS(t.id).map, state.ym);
    Object.entries(p.rows).forEach(([d, r]) => { td.rows[d] = { ...(td.rows[d] || {}), ...r }; });
    saveMonth(); renderMain(); renderNav();
    toast(`${p.count}일 반영${p.other ? ` · 정산월이 다른 행 ${p.other}건 제외` : ''}`);
  }
  if (act === 'clear' && confirm(`${t.name} ${ymLabel(state.ym)} 일별 데이터를 모두 지울까요?`)) { td.rows = {}; saveMonth(); renderMain(); renderNav(); }
  if (act === 'cloudClear' && confirm(`${ymLabel(state.ym)} 안심클라우드 원천 파일(일자별·CTN)과 일별 표를 비울까요?`)) {
    delete td.extra.cloudSrc; delete td.extra.ctnDays; delete td.extra.ctnAmt; td.rows = {}; saveMonth();
    delete ctnMem[state.ym]; ctnPut(state.ym, {}).then(() => { renderMain(); renderNav(); });
  }
  if (act === 'loadCarry') { td.extra.carry = a.dataset.v; saveMonth(); renderMain(); renderNav(); }
  if (act === 'resetSet' && confirm(`${t.name}의 단가·기준 설정을 기본값으로 되돌릴까요?`)) { const keep = settings[t.id] || {}; settings[t.id] = { tplSheet: keep.tplSheet, tplMap: keep.tplMap }; store.set('stl.settings.v1', settings); renderMain(); renderNav(); }
});
main.addEventListener('input', e => {
  const t = T[state.view]; if (!t) return; const el = e.target, td = tdata(t.id);
  if (el.dataset.k) { const d = el.dataset.d; td.rows[d] = { ...(td.rows[d] || {}), [el.dataset.k]: el.value.trim() }; saveMonth(); refreshLive(t); }
  else if (el.dataset.extra) { td.extra[el.dataset.extra] = el.value.trim() === '' ? undefined : el.value.trim(); saveMonth(); if (el.dataset.extra !== 'paidNote') refreshLive(t); }
  else if ('memo' in el.dataset) { td.memo = el.value; saveMonth(); }
});
main.addEventListener('change', async e => {
  if ('tplbulk' in e.target.dataset) { const fs = e.target.files; if (fs.length) await registerBulk(fs); e.target.value = ''; return; }
  const t = T[state.view]; if (!t) return; const el = e.target, td = tdata(t.id);
  if ('cloudsrc' in el.dataset) { const fs = [...el.files]; el.value = ''; if (fs.length) await busy(null, () => importCloudFiles(t, fs)); return; }
  if (el.dataset.check != null) { td.checks[+el.dataset.check] = el.checked; saveMonth(); renderMain(); renderNav(); }
  else if (el.dataset.map) { const s = getS(t.id); setS(t.id, { map: { ...s.map, [el.dataset.map]: +el.value } }); }
  else if ('tplfile' in el.dataset) {
    const f = el.files[0]; if (!f) return;
    try { if (await registerTpl(t, f)) renderTplCard(t); } catch (err) { alert('엑셀 파일을 읽지 못했습니다: ' + (err.message || err)); }
  }
  else if ('tplsheet' in el.dataset) { setS(t.id, { tplSheet: el.value || undefined }); renderTplCard(t); }
  else if (el.dataset.tplmap) { const s = getS(t.id); setS(t.id, { tplMap: { ...s.tplMap, [el.dataset.tplmap]: el.value } }); }
  else if (el.dataset.set) {
    const k = el.dataset.set, v = el.type === 'checkbox' ? el.checked : el.value.trim();
    if (k.startsWith('days.')) { const s = getS(t.id); setS(t.id, { days: { ...s.days, [k.slice(5)]: v } }); } else setS(t.id, { [k]: v });
    renderMain(); renderNav();
  }
});
main.addEventListener('keydown', e => {
  const el = e.target; if (!el.dataset.k || (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  const nx = document.querySelector(`input[data-d="${+el.dataset.d + (e.key === 'ArrowUp' ? -1 : 1)}"][data-k="${el.dataset.k}"]`);
  if (nx) { e.preventDefault(); nx.focus(); nx.select(); }
});
$('#btnBackup').addEventListener('click', async () => {
  const out = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('stl.') && !k.startsWith('stl.tpl.')) out[k] = JSON.parse(localStorage.getItem(k)); } } catch (e) { Object.assign(out, mem); }
  let n = 0;
  for (const t of TARGETS) { const rec = await tplGet(t.id); if (rec) { out['stl.tpl.' + t.id] = { name: rec.name, savedAt: rec.savedAt, source: rec.source, b64: ab2b64(rec.buf) }; n++; } }
  const d = new Date(); download(`정산워크벤치_백업_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`, new Blob([JSON.stringify(out)], { type: 'application/json' }));
  toast(`입력값·설정과 기존 양식 파일 ${n}개를 백업했습니다.`);
});
$('#restore').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!confirm(`백업의 ${Object.keys(data).length}개 항목으로 현재 데이터를 덮어쓸까요?`)) return;
    for (const [k, v] of Object.entries(data)) {
      if (k.startsWith('stl.tpl.')) { const id = k.slice(8); if (T[id] && v && v.b64) await tplPut(id, { name: v.name, savedAt: v.savedAt, source: v.source, buf: b642ab(v.b64) }); }
      else if (k.startsWith('stl.')) store.set(k, v);
    }
    settings = store.get('stl.settings.v1', {}); loadMonth(); renderAll(); toast('복원했습니다.');
  } catch (err) { alert('백업 파일을 읽지 못했습니다.'); }
  e.target.value = '';
});

if (state.view !== 'dash' && !T[state.view]) state.view = 'dash';

/* 서버 값을 먼저 읽고 화면을 그린다. 다른 사람이 저장하면 보고 있는 달만 새로 고친다. */
STL_SYNC.init({
  onRemote(keys) {
    const mine = keys.filter(k => k === 'stl.settings.v1' || k === monthKey(state.ym) || k === 'stl.tplmeta');
    if (!mine.length) return;
    if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    mine.forEach(store.forget);
    settings = store.get('stl.settings.v1', {});
    loadMonth(); renderAll();
    toast('다른 사람이 저장한 내용을 가져왔습니다.');
  }
}).then(okOnline => {
  loadMonth(); renderAll();
  if (!okOnline) toast('서버에 연결하지 못했습니다 — 이 브라우저에만 저장됩니다.');
});
</script>
</body>
</html>
